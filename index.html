:root{color-scheme:dark;--red:#d95b75;--rose:#ffb7c6;--ink:#100b13}*{box-sizing:border-box}html{min-height:100%;background:var(--ink)}body{margin:0;min-height:100dvh;color:#f9e9ed;font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 0%,#45202e 0%,#1b101b 45%,#0d0a11 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background:repeating-linear-gradient(90deg,transparent 0 74px,#ffffff08 75px 76px)}.shell{width:min(94%,620px);margin:auto;padding:38px 0 60px;position:relative}.eyebrow{text-align:center;font:11px/1.5 system-ui,sans-serif;letter-spacing:.32em;color:#d6a4af;text-transform:uppercase}.ornament{text-align:center;color:#e9a5b4;font-size:26px;margin:14px 0}.panel{position:relative;margin-top:22px;padding:clamp(26px,7vw,50px) clamp(22px,6vw,45px);border:1px solid #92506488;border-radius:20px;background:linear-gradient(145deg,#2d1929df,#130e19f5);box-shadow:0 20px 75px #0009, inset 0 0 45px #a4455510;text-align:center;animation:rise .7s ease both}.panel:after{content:"";position:absolute;inset:9px;border:1px solid #8d51603d;border-radius:13px;pointer-events:none}h1{font-weight:normal;font-size:clamp(34px,8vw,55px);line-height:1.1;margin:15px 0 12px;color:#ffe0e5;text-shadow:0 0 35px #db59743d}h2{font-weight:normal;font-size:clamp(26px,6vw,35px);color:#ffe0e5;margin:8px 0 18px}.subtitle{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#e9a8b8}.prose{font-size:clamp(17px,4.3vw,21px);line-height:1.85;white-space:pre-line;margin:22px 0;color:#f8e5e9}.small{font-size:15px;color:#e4b7c2;line-height:1.7}.button{position:relative;z-index:2;border:1px solid #dc8b9c;border-radius:50px;background:linear-gradient(135deg,#813449,#4a223b);color:#fff0f3;font:600 12px/1.3 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:17px 24px;min-height:52px;max-width:100%;cursor:pointer;box-shadow:0 0 25px #a9446055;transition:transform .2s,background .2s;animation:pulse 3s infinite}.button:active{transform:scale(.97)}.button:focus-visible{outline:3px solid #ffcfdb;outline-offset:4px}.ghost{background:transparent;box-shadow:none;border-color:#865366}.hidden{display:none!important}.progress{font:11px system-ui,sans-serif;letter-spacing:.22em;color:#dca6b3;margin-bottom:20px}.heartline{display:flex;align-items:center;justify-content:center;gap:13px;margin:23px 0;font-size:44px}.blackheart{color:#0a0710;text-shadow:0 0 2px #e8acba,0 0 17px #9b5a80;animation:leftHeart 4s ease-in-out infinite}.redheart{color:#d74563;text-shadow:0 0 22px #d7456380;animation:rightHeart 4s ease-in-out infinite}.merged{font-size:70px;filter:drop-shadow(0 0 22px #db4d79);animation:beat 2s infinite}.fine{height:1px;width:90px;margin:22px auto;background:linear-gradient(90deg,transparent,#dc849a,transparent)}.foot{text-align:center;color:#b78697;font:11px system-ui,sans-serif;letter-spacing:.2em;margin-top:26px}.audio{position:fixed;right:12px;top:12px;z-index:10;background:#241722dd;border:1px solid #a56a7e;border-radius:50px;color:#f7dbe3;padding:10px 13px;font:12px system-ui,sans-serif;cursor:pointer}.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;border-radius:50%;width:2px;height:2px;background:#e8a2b5;opacity:.25;animation:twinkle 5s infinite alternate}@keyframes twinkle{to{opacity:.75;transform:translateY(-12px)}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{box-shadow:0 0 37px #e366827e}}@keyframes leftHeart{50%{transform:translateX(8px)}}@keyframes rightHeart{50%{transform:translateX(-8px)}}@keyframes beat{50%{transform:scale(1.09)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

'use strict';const panel=document.getElementById('panel');const notes=[{title:'Your Kiss',text:`Here's something you may not realize about me. I've never really been much of a kisser. But then there's you. And suddenly I can't seem to get enough. Every kiss makes me want another, and even when we're as close as two people can be, I somehow still want to pull you closer.`},{title:'Your Scent',text:`Your scent is absolutely intoxicating to me. It's one of those things I can't quite explain, and honestly, I don't think I want to. I just know that when you're close, I want to stay there. And when you're gone, it's one of the first things I find myself missing.`},{title:'Your Touch',text:`And then there's the way you touch me. Those gentle little caresses, the way your hand finds mine, the softness of being close to you. Nell, I don't think you understand what those moments do to me. You've managed to melt parts of my heart I didn't even know were waiting to be touched. I've genuinely never felt anything quite like it.`}];let stage=0;const el=(tag,cls,content)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=content;return n};function btn(label,next,ghost=false){const b=el('button','button'+(ghost?' ghost':''),label);b.type='button';b.addEventListener('click',()=>{stage=next;render();window.scrollTo({top:0,behavior:'smooth'})});return b}function add(tag,cls,text){const n=el(tag,cls,text);panel.append(n);return n}function render(){panel.replaceChildren();panel.style.animation='none';void panel.offsetWidth;panel.style.animation='rise .7s ease both';if(stage===0){add('div','subtitle','The beautiful aftermath');add('h1','','The Silence After You');add('div','fine');add('p','prose','The room is quiet again.\n\nAnd there’s something I need you to know…');panel.append(btn('One Last Thing, Nell…',1));}else if(stage>=1&&stage<=3){const n=notes[stage-1];add('div','progress','CONFESSION '+['I','II','III'][stage-1]+' OF III');add('div','ornament',stage===1?'♡':stage===2?'✿':'❦');add('h2','',n.title);add('p','prose',n.text);panel.append(btn(stage===3?'There’s Something More…':'Unseal the Next Confession',stage+1));}else if(stage===4){add('div','subtitle','Beyond all of it');add('div','fine');add('p','prose',`And the craziest part?\n\nNone of those things are why you're so special to me.\n\nThey're just three more reasons I never seem to get enough of you.`);panel.append(btn('What I Really Want You to Know',5));}else if(stage===5){add('div','subtitle','Already missing you');add('h2','','Nell,');add('p','prose',`I don't know how you manage to do it.\n\nI can spend hours with you, fall asleep beside you, wake up knowing you're still there, and somehow it still never feels like enough time.\n\nBecause the moment you leave, I already miss you.\n\nNot because I'm unhappy when you're gone, but because being with you makes me ridiculously happy.\n\nI hope you know how wonderful you are. Not just to me, but as the person you are.\n\nAnd if there's one thing I hope you never question, it's how genuinely happy I am that you walked into my life.\n\nI'd relive every minute of this weekend.\n\nEspecially the ones where we weren't doing anything at all.\n\nBecause those were pretty damn perfect, too.`);add('p','small','— Your Red Heart ❤️');panel.append(btn('One Final Thought…',6));}else{add('div','subtitle','The story continues');const hearts=el('div','heartline');hearts.append(el('span','blackheart','♥'),el('span','redheart','♥'));panel.append(hearts);add('h2','','The Nell Nocturne may have ended.');add('p','prose','But my favorite part of the story is still you.');add('div','merged','♥');add('p','prose','Sleep well, beautiful.\nYou’re already missed. 🖤❤️');add('div','fine');add('p','small','No questions. No need to reply. Just wanted you to know.');panel.append(btn('Read Again',0,true));}}
render();const stars=document.getElementById('stars');for(let i=0;i<35;i++){const s=el('i','star');s.style.left=((i*47.31)%100)+'%';s.style.top=((i*29.73)%100)+'%';s.style.animationDelay=((i*1.7)%5)+'s';stars.append(s)}

let ctx=null,voices=[],playing=false;const audio=document.getElementById('audio');function stopAudio(){if(ctx){const old=ctx;ctx=null;voices.forEach(v=>{try{v.stop()}catch(e){}});voices=[];old.close().catch(()=>{})}playing=false;audio.textContent='♫ Sound off';audio.setAttribute('aria-pressed','false')}function startAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){audio.textContent='Sound unavailable';return}try{ctx=new AC();ctx.resume();const master=ctx.createGain();master.gain.value=.07;master.connect(ctx.destination);[110,164.81,220,261.63,329.63].forEach((freq,i)=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.value=i===0?.22:.065;osc.connect(g);g.connect(master);osc.start();voices.push(osc)});playing=true;audio.textContent='♫ Sound on';audio.setAttribute('aria-pressed','true')}catch(e){stopAudio()}}audio.addEventListener('click',()=>playing?stopAudio():startAudio());document.addEventListener('visibilitychange',()=>{if(document.hidden&&ctx)ctx.suspend();else if(!document.hidden&&playing&&ctx)ctx.resume()});
