<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19141e"><title>Nell Before Noon • Day 10</title><style>
:root{color-scheme:dark;font-family:Georgia,'Times New Roman',serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#403044 0%,#211a29 45%,#100e16 100%);color:#f7e9df;min-height:100vh}.wrap{max-width:660px;margin:auto;padding:35px 17px 65px}.eyebrow{text-align:center;letter-spacing:.24em;font:11px system-ui,sans-serif;color:#d7b2c4;text-transform:uppercase}.hero{text-align:center;padding:16px 0 28px}.hero h1{font-size:clamp(34px,9vw,52px);margin:12px 0 5px;line-height:1.05}.hero p{color:#d9bdca;font-style:italic;font-size:16px}.moon{font-size:29px;color:#e6b5c9}.card{background:#f4e9d9;color:#382c37;border:1px solid #fff6e8;border-radius:18px;padding:23px 20px;margin:18px 0;box-shadow:0 12px 30px #0004}.num{font:700 11px system-ui,sans-serif;letter-spacing:.2em;color:#906b7c;text-transform:uppercase}.card h2{font-size:25px;margin:10px 0;line-height:1.2}.question{font-size:16px;line-height:1.55;color:#6b5462;margin:0 0 18px}.options{display:grid;gap:10px}.option{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #d9c6c5;border-radius:11px;padding:13px 12px;cursor:pointer;background:#fff9f0;transition:.15s;font:15px/1.4 system-ui,sans-serif;color:#40313b;user-select:none}.option:has(input:checked){border-color:#8e5778;background:#ecdce6;box-shadow:inset 0 0 0 1px #8e5778}.option input{accent-color:#875270;width:19px;height:19px;flex:none;margin:1px 0 0}.hint{font:12px system-ui,sans-serif;color:#876e79;margin-top:15px}.footer{text-align:center;padding:20px 8px}.footer p{color:#d7b6c7;font-style:italic}.btn{border:0;border-radius:999px;padding:17px 25px;width:100%;font:700 15px system-ui,sans-serif;letter-spacing:.03em;cursor:pointer;background:#d9a9bd;color:#251522;box-shadow:0 8px 25px #0005}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{margin-top:12px;background:transparent;color:#f3dce6;border:1px solid #a17e94;box-shadow:none}.status{font:13px/1.5 system-ui,sans-serif;color:#e5cbd7;min-height:22px;margin-top:13px}.small{font:12px/1.6 system-ui,sans-serif;color:#bba5b3;margin-top:17px}.spark{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px)}}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">Saturday • October 17 • Day 10</div><div class="moon spark">☾ ✦ ☕</div><h1>Nell Before Noon</h1><p>The Beautifully Random Edition</p><div class="eyebrow">Four questions. Zero predictable answers.</div></header><div id="cards"></div><footer class="footer"><p>Some of the best discoveries are the wonderfully weird ones. 🖤</p><button id="send" class="btn" disabled>Send My Answers ✦</button><button id="copy" class="btn secondary" disabled>Copy My Answers Instead</button><div id="status" class="status" aria-live="polite"></div><div class="small">Choose as many answers as you like for each question. Your selections will be included in the message.</div></footer></main><script>
const PHONE='6082340286';
const data=[
{title:'The Alternate Universe',question:"If you could wake up tomorrow morning having mastered something you've never even attempted, what would you choose?",options:['Speak every language fluently','Play an instrument like a professional','Become an incredible artist','Know how to fix or build absolutely anything','Have a completely unexpected talent','Something much stranger']},
{title:'The Childhood Plot Twist',question:'What was something you were absolutely convinced was true when you were little, but turned out to be completely wrong?',options:['Something supernatural','Something my parents told me','Something about how the world worked','A ridiculous childhood fear','I had a pretty wild imagination','I have a story for this one!']},
{title:'The Personality Glitch',question:'Which of these contradictions describes you surprisingly well?',options:['I love surprises, but hate not knowing what’s happening.','I can be incredibly independent but secretly love being taken care of.','I’m shy until I’m comfortable, then good luck shutting me up.','I overthink everything but occasionally make wildly impulsive decisions.','I’m sentimental about the weirdest things.','I’m somehow a combination of all of these.']},
{title:'The Unexplained Nell Phenomenon',question:'If I discovered one completely random, oddly specific thing about you six months from now, what would be the least surprising?',options:['I have an irrational grudge against something ridiculous.','I collect or save something nobody would expect.','I have a bizarre personal ritual.','I know an absurd amount about a very obscure subject.','I have a completely unreasonable opinion that I’ll defend forever.','There’s something about me that you couldn’t possibly guess.']}
];
const cards=document.getElementById('cards');
data.forEach((q,i)=>{const section=document.createElement('section');section.className='card';const num=document.createElement('div');num.className='num';num.textContent=`Question ${String(i+1).padStart(2,'0')} / 04`;const h=document.createElement('h2');h.textContent=q.title;const p=document.createElement('p');p.className='question';p.textContent=q.question;const options=document.createElement('div');options.className='options';q.options.forEach((a,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='checkbox';input.name=`q${i}`;input.value=a;input.addEventListener('change',update);const span=document.createElement('span');span.textContent=a;label.append(input,span);options.append(label)});const hint=document.createElement('div');hint.className='hint';hint.textContent='✦ Select all that apply';section.append(num,h,p,options,hint);cards.append(section)});
function selected(i){return [...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(x=>x.value)}
function update(){const ready=data.every((_,i)=>selected(i).length>0);document.getElementById('send').disabled=!ready;document.getElementById('copy').disabled=!ready;document.getElementById('status').textContent=''}
function message(){return '🖤 NELL BEFORE NOON — DAY 10 🖤\nThe Beautifully Random Edition\n\n'+data.map((q,i)=>`${i+1}. ${q.title}\n${selected(i).map(a=>'• '+a).join('\n')}`).join('\n\n')+'\n\n☕ Saturday mysteries, officially submitted.'}
function copyFallback(s){const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove()}
document.getElementById('copy').addEventListener('click',async()=>{const s=message();try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(s);else copyFallback(s);document.getElementById('status').textContent='Answers copied! Paste them into a text to Ryan. 🖤'}catch(e){copyFallback(s);document.getElementById('status').textContent='If copying was blocked, try opening this page in Chrome.'}});
document.getElementById('send').addEventListener('click',()=>{const s=message();const ua=navigator.userAgent||'';const ios=/iPhone|iPad|iPod/i.test(ua);const sep=ios?'&':'?';const url=`sms:${PHONE}${sep}body=${encodeURIComponent(s)}`;document.getElementById('status').textContent='Opening your messaging app… If the answers do not appear, come back and tap “Copy My Answers Instead.”';window.location.href=url});
</script></body></html>
