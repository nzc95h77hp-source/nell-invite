<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nell After Dark — Night 3</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#39233f,#100d19 70%);color:#f4e7e9;font-family:Georgia,serif;text-align:center;padding:32px 15px}main{max-width:680px;margin:auto}h1{font-size:clamp(30px,7vw,48px);margin:15px 0 4px;color:#f3d3df}h2{font-size:19px;font-weight:normal;color:#e2bdd0}p{line-height:1.5}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:30px 0}.card{min-height:215px;padding:15px 8px;border:1px solid #b18ca9;border-radius:13px;background:linear-gradient(145deg,#43283e,#201827);color:#f8e6e9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;font-family:Georgia,serif;box-shadow:0 8px 24px #0007;transition:transform .35s,opacity .35s;overflow-wrap:anywhere}.card .symbol{font-size:32px}.card strong{font-size:clamp(13px,3vw,19px)}.card small{font-size:clamp(11px,2.4vw,14px);line-height:1.4}.card.back{background:repeating-linear-gradient(45deg,#2e2037,#2e2037 10px,#382743 10px,#382743 20px);cursor:pointer}.card.back strong{font-size:18px}.card:disabled{opacity:1}.card.pick{cursor:pointer}.card.chosen{grid-column:1/-1;max-width:390px;width:100%;margin:auto;min-height:220px}.cards.single{grid-template-columns:1fr}.shuffling .card:nth-child(1){animation:mix1 .7s ease-in-out 2}.shuffling .card:nth-child(2){animation:mix2 .7s ease-in-out 2}.shuffling .card:nth-child(3){animation:mix3 .7s ease-in-out 2}@keyframes mix1{50%{transform:translateX(60%) rotate(10deg)}}@keyframes mix2{50%{transform:translateY(-20px) rotate(-12deg)}}@keyframes mix3{50%{transform:translateX(-60%) rotate(10deg)}}button.action{border:1px solid #f2cbd8;border-radius:40px;background:#d7a5bd;color:#221320;padding:15px 28px;font:700 16px Georgia,serif;cursor:pointer;min-height:50px}button.action:active{transform:scale(.98)}textarea{width:100%;min-height:170px;border-radius:12px;background:#241a2c;border:1px solid #a88ba7;color:white;padding:15px;font:16px/1.5 system-ui;resize:vertical}#answerArea{max-width:550px;margin:20px auto}#seal{margin-top:15px}#status{color:#e9bfd1}footer{margin-top:40px;color:#bda8b7;font-size:12px}[hidden]{display:none!important}@media(max-width:420px){.cards{gap:6px}.card{min-height:205px;padding:10px 5px}}</style></head><body><main><div style="font-size:25px">☾ ✦ ☽</div><h1>Nell After Dark</h1><h2>Night III · Shuffle Your Fate</h2><p id="instructions">Three cards. Two temptations. One dangerous confession. Read carefully… then let fate decide.</p><section id="cards" class="cards" aria-label="Mystery cards"></section><button id="shuffle" class="action" type="button">✦ Shuffle Your Fate ✦</button><section id="answerArea" hidden><p>Fate has spoken. Your answer is your confession.</p><textarea id="answer" placeholder="Your confession begins here…" aria-label="Your answer"></textarea><button id="seal" class="action" type="button" hidden>✉ Seal Your Fate ✉</button><p id="status" role="status"></p></section><footer>Some choices are made. Others are dealt. 🖤</footer></main><script>
(function () {
  'use strict';
  var phone = '6082340286';
  var questions = [
    {name:'The Unexpected Weakness',symbol:'♥',question:'What’s a personality trait that makes a man significantly more attractive to you than his looks ever could?'},
    {name:'The Dangerous Game',symbol:'✦',question:'What’s more intoxicating to you: a man who keeps you guessing, or one who makes his intentions unmistakably clear? Why?'},
    {name:'Burning Desire',symbol:'🔥',question:'What’s one desire you’ve kept to yourself because admitting it out loud would make you feel just a little too vulnerable?'}
  ];
  var cards = document.getElementById('cards');
  var shuffle = document.getElementById('shuffle');
  var instructions = document.getElementById('instructions');
  var area = document.getElementById('answerArea');
  var answer = document.getElementById('answer');
  var seal = document.getElementById('seal');
  var status = document.getElementById('status');
  var deck = questions.slice();
  var stage = 'preview';
  var selected = null;
  function render() {
    cards.innerHTML = '';
    for (var i=0; i<deck.length; i++) {
      (function(index) {
        var q = deck[index];
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        if (stage === 'preview' || stage === 'chosen') {
          if (stage === 'chosen') card.className += ' chosen';
          card.innerHTML = '<span class="symbol">'+q.symbol+'</span><strong>'+q.name+'</strong><small>'+q.question+'</small>';
          card.disabled = true;
        } else {
          card.className += ' back pick';
          card.innerHTML = '<span class="symbol">✦</span><strong>Choose Me</strong><small>Tap to reveal</small>';
          card.onclick = function () { choose(index); };
        }
        cards.appendChild(card);
      })(i);
    }
  }
  function choose(index) {
    if (stage !== 'pick') return;
    selected = deck[index];
    deck = [selected];
    stage = 'chosen';
    cards.className = 'cards single';
    render();
    instructions.textContent = 'Your fate is sealed to this card. There is no turning back.';
    area.hidden = false;
    answer.focus();
  }
  function startShuffle() {
    if (stage !== 'preview') return;
    stage = 'shuffling';
    shuffle.hidden = true;
    for (var i=deck.length-1; i>0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var temp = deck[i]; deck[i] = deck[j]; deck[j] = temp;
    }
    cards.className = 'cards shuffling';
    instructions.textContent = 'The cards are moving…';
    window.setTimeout(function () {
      stage = 'pick';
      cards.className = 'cards';
      instructions.textContent = 'Choose one card. Fate allows only one.';
      render();
    }, 1450);
  }
  shuffle.onclick = startShuffle;
  answer.oninput = function () {
    seal.hidden = answer.value.trim().length < 5;
    status.textContent = '';
  };
  seal.onclick = function () {
    if (!selected || answer.value.trim().length < 5) return;
    var message = 'NELL AFTER DARK — NIGHT 3\nCard: ' + selected.name + '\nQuestion: ' + selected.question + '\nAnswer: ' + answer.value.trim();
    status.textContent = 'Opening Messages… Tap Send to deliver your confession.';
    window.location.href = 'sms:' + phone + '&body=' + encodeURIComponent(message);
  };
  render();
})();
</script></body></html>
