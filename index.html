<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b13"><title>Nell After Dark — The Beautifully Twisted Mind</title><style>
:root{color-scheme:dark;--ink:#f5e8e4;--muted:#c7abb7;--accent:#e6a0b5;--line:#6d4056}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#462335 0%,#1c101e 48%,#09080d 100%);color:var(--ink);font-family:Georgia,serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,#ffffff04 5px 6px);opacity:.35}.wrap{max-width:680px;margin:auto;padding:30px 17px 65px}.top{text-align:center;margin:24px auto 26px}.eyebrow{letter-spacing:.3em;color:#e3a9b9;font:11px system-ui,sans-serif;text-transform:uppercase}.moon{font-size:40px;filter:drop-shadow(0 0 15px #d385a8)}h1{font-weight:normal;font-size:clamp(34px,8vw,56px);line-height:1.08;margin:12px 0}p{line-height:1.6;color:var(--muted)}.tag{font-style:italic;max-width:430px;margin:14px auto}.card{position:relative;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#2c1928ef,#150f19f5);box-shadow:0 16px 50px #0007,inset 0 1px #ffffff12;padding:25px 19px;margin:16px 0}.number{font:11px system-ui,sans-serif;letter-spacing:.22em;color:#dda2b6}.card h2{font-size:26px;font-weight:normal;margin:10px 0}.question{font-style:italic;color:#f0cbd4;margin-bottom:18px}.option{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;background:#1a121e;border:1px solid #604257;border-radius:12px;padding:14px;margin:10px 0;color:var(--ink);font:15px/1.5 system-ui,sans-serif;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s}.option[aria-pressed=true]{background:#583048;border-color:#f0b5c7;box-shadow:0 0 0 1px #e3a3b5}.check{width:23px;height:23px;flex:0 0 23px;border:1px solid #a67c90;border-radius:6px;display:grid;place-items:center;font-size:16px}.option[aria-pressed=true] .check{background:#e6a0b5;color:#24101e;border-color:#e6a0b5}.hint{font:12px system-ui,sans-serif;color:#b9a1ae;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #e4a3b9;border-radius:12px;background:linear-gradient(135deg,#b45b80,#813b60);color:white;font:600 15px system-ui,sans-serif;padding:15px 20px;min-height:52px;cursor:pointer;flex:1}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.secondary{background:#241727;color:#f5d7e2}.progress{display:flex;gap:7px;justify-content:center;margin:20px auto}.dot{height:5px;flex:1;max-width:80px;background:#513346;border-radius:4px}.dot.on{background:#e7a5b9}.hidden{display:none!important}.end{text-align:center}.end .seal{font-size:42px}.footer{text-align:center;font:11px system-ui,sans-serif;color:#977d8c;margin-top:25px}.pulse{animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 23px #d76c9d88}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><header class="top"><div class="moon">☾</div><div class="eyebrow">Nell After Dark · Confidential Case Files</div><h1>The Beautifully<br>Twisted Mind</h1><p class="tag">Some people have skeletons in their closets. I'd rather know which ones you keep as pets.</p><p>Four case files. No wrong answers. Choose <strong>as many as feel like you.</strong></p></header><div class="progress" id="progress" aria-label="Case file progress"></div><section id="stage" aria-live="polite"></section><footer class="footer">FOR NELL'S EYES ONLY · SOME SECRETS ARE WORTH SHARING</footer></main><script>
const phone='16082340286';
const files=[
{title:'The Beautiful Disaster',q:'Which of these sound suspiciously like you?',options:['I overthink conversations that probably went perfectly fine.','Dark humor is practically my love language.','I can be incredibly affectionate once I feel safe.','I love being alone, but I also want someone who genuinely wants me around.','I’m secretly a bigger romantic than I let on.']},
{title:'The Horror of Being Known',q:'What makes you feel genuinely close to someone?',options:['Being able to sit together in comfortable silence.','Someone remembering tiny details about me.','Being able to share my weirdest thoughts without judgment.','Physical affection that doesn’t need to lead anywhere.','Someone noticing when my mind is getting too loud.']},
{title:'Dangerous Attractions',q:'What little things make someone unexpectedly irresistible?',options:['A wicked sense of humor.','Confidence without arrogance.','Unexpected tenderness.','Someone who isn’t afraid to flirt boldly.','Feeling like they genuinely understand my strange little brain.']},
{title:'The Plot Twist',q:'Which unexpected moments would secretly make your heart melt?',options:['A forehead kiss when I’m least expecting it.','Someone pulling me closer during a scary movie.','A message saying they were thinking about me.','Being held tightly after a particularly difficult day.','Someone telling me they like the parts of myself I usually hide.']}
];
let page=0;const picks=files.map(()=>new Set());const stage=document.getElementById('stage');const progress=document.getElementById('progress');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(){stage.replaceChildren();progress.replaceChildren();for(let i=0;i<files.length;i++){const d=el('span','dot'+(i<=page?' on':''));progress.append(d)}if(page===files.length){renderEnd();return}const f=files[page],card=el('section','card');card.append(el('div','number',`CASE FILE ${String(page+1).padStart(2,'0')} / 04`),el('h2','',f.title),el('p','question',f.q));f.options.forEach((o,i)=>{const b=el('button','option');b.type='button';b.setAttribute('aria-pressed',picks[page].has(i));const check=el('span','check',picks[page].has(i)?'✓':'');check.setAttribute('aria-hidden','true');b.append(check,el('span','',o));b.addEventListener('click',()=>{picks[page].has(i)?picks[page].delete(i):picks[page].add(i);render()});card.append(b)});card.append(el('p','hint','Select one, several, or all that apply.'));const actions=el('div','actions');if(page>0){const back=el('button','btn secondary','← Previous file');back.onclick=()=>{page--;render();scrollTop()};actions.append(back)}const next=el('button','btn pulse',page===3?'Seal the case →':'Open next file →');next.disabled=picks[page].size===0;next.onclick=()=>{page++;render();scrollTop()};actions.append(next);card.append(actions);stage.append(card)}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
function message(){return 'NELL AFTER DARK — THE BEAUTIFULLY TWISTED MIND 🖤\n\n'+files.map((f,i)=>`CASE FILE ${i+1}: ${f.title.toUpperCase()}\n`+[...picks[i]].sort((a,b)=>a-b).map(j=>'• '+f.options[j]).join('\n')).join('\n\n')+'\n\nCase closed. 🖤'}
function renderEnd(){const card=el('section','card end');card.append(el('div','seal','🖤'),el('div','number','CASE CLOSED · CONFIDENTIAL'),el('h2','','The Verdict'),el('p','',"You're considerably more interesting than you probably give yourself credit for. And for the record, I'm enjoying every new thing I discover about you."),el('p','hint','Your selections are ready. Nothing gets sent until you choose to send it.'));const actions=el('div','actions');const send=el('button','btn pulse','Text my case files →');send.onclick=()=>{const sms='sms:'+phone+'?body='+encodeURIComponent(message());window.location.href=sms};const copy=el('button','btn secondary','Copy my answers');copy.onclick=async()=>{const t=message();try{await navigator.clipboard.writeText(t);copy.textContent='Copied ✓'}catch(e){fallbackCopy(t,copy)}};const back=el('button','btn secondary','← Edit answers');back.onclick=()=>{page=3;render()};actions.append(send,copy,back);card.append(actions);stage.append(card)}
function fallbackCopy(t,b){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();try{document.execCommand('copy');b.textContent='Copied ✓'}catch(e){b.textContent='Copy unavailable'}a.remove()}
render();
</script></body></html>
