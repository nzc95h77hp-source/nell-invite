<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211b28"><title>Nell Before Noon · Day III</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#44334d,#211b28 65%);color:#382a3a;font-family:Georgia,'Times New Roman',serif;padding:32px 16px 60px}.wrap{max-width:520px;margin:auto}.card{background:#f1e6d2;border:1px solid #d5bea0;border-radius:20px;padding:27px 22px;box-shadow:0 20px 65px #0007}.eyebrow{text-align:center;color:#826951;letter-spacing:2.5px;font:11px system-ui,sans-serif;font-weight:700}.coffee{text-align:center;font-size:35px;margin:20px 0 8px}h1{text-align:center;font-size:32px;line-height:1.12;margin:10px 0 14px}p.intro{text-align:center;font-style:italic;color:#765f55;line-height:1.55}hr{border:0;border-top:1px solid #d6c2a9;margin:25px 0}h2{font-size:17px;text-align:center;margin:0 0 17px}.choice{display:flex;align-items:center;width:100%;gap:14px;text-align:left;border:1px solid #d6c2a9;border-radius:12px;background:#faf3e9;color:#382a3a;padding:17px 15px;margin:10px 0;font:600 16px Georgia,serif;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.choice:active{transform:scale(.99)}.choice.selected{background:#e0ccb4;border-color:#80634f}.emoji{font-size:25px}.tick{margin-left:auto;color:#80634f}.answer{display:none;margin-top:22px;background:#fbf5ec;border:1px solid #d6c2a9;border-radius:13px;padding:18px}.answer.show{display:block}.kicker{font:700 11px system-ui,sans-serif;letter-spacing:2px;color:#80634f}.question{font-size:19px;line-height:1.45;margin:12px 0 17px}textarea{display:block;width:100%;min-height:145px;resize:vertical;border:1px solid #cdb79e;border-radius:9px;padding:13px;background:#fffdf8;color:#382a3a;font:16px/1.5 system-ui,sans-serif;outline-color:#80634f}button.submit{display:none;width:100%;background:#34273b;color:#fff2e2;border:0;border-radius:10px;padding:17px;margin-top:15px;font:700 14px system-ui,sans-serif;letter-spacing:1px;cursor:pointer;touch-action:manipulation}button.submit.show{display:block}.hint{font:12px system-ui,sans-serif;color:#80634f;margin:10px 0 0}.footer{text-align:center;color:#c9b3ca;font:12px system-ui,sans-serif;margin:22px auto;letter-spacing:1px}</style></head><body><main class="wrap"><section class="card"><div class="eyebrow">NELL BEFORE NOON · DAY III</div><div class="coffee">☕</div><h1>The Saturday Confessional</h1><p class="intro">Some pleasures are best enjoyed before noon.<br>Others are best kept secret.</p><hr><h2>Pick your guilty pleasure category</h2><div id="choices"><button class="choice" type="button" data-index="0"><span class="emoji">🍪</span><span>Secret Snacks</span><span class="tick">○</span></button><button class="choice" type="button" data-index="1"><span class="emoji">📺</span><span>Embarrassing Entertainment</span><span class="tick">○</span></button><button class="choice" type="button" data-index="2"><span class="emoji">✨</span><span>Your Secret Obsession</span><span class="tick">○</span></button></div><div id="answer" class="answer" aria-live="polite"><div class="kicker">YOUR CONFESSION</div><div id="question" class="question"></div><textarea id="response" placeholder="Come on, Nell. Spill the beans..." aria-label="Your answer"></textarea><p id="hint" class="hint">Write at least five characters to reveal your button.</p><button id="submit" class="submit" type="button">SPILL THE BEANS ☕</button></div></section><div class="footer">A LITTLE COFFEE. A LITTLE CONFESSION. 🖤</div></main><script>(function(){'use strict';var phone='6082340286';var items=[{title:'Secret Snacks',question:'What’s a food combination or snack you secretly love that other people would absolutely judge you for?'},{title:'Embarrassing Entertainment',question:'What’s a show, song, or movie you love that you’d be slightly embarrassed to admit?'},{title:'Your Secret Obsession',question:'What’s something you absolutely love that you’d probably get teased about if everyone knew?'}];var selected=-1;var choices=document.querySelectorAll('.choice');var panel=document.getElementById('answer');var question=document.getElementById('question');var response=document.getElementById('response');var submit=document.getElementById('submit');var hint=document.getElementById('hint');function update(){var ready=response.value.trim().length>=5;submit.classList.toggle('show',ready);hint.style.display=ready?'none':'block'}for(var i=0;i<choices.length;i++){choices[i].addEventListener('click',function(){selected=Number(this.getAttribute('data-index'));for(var j=0;j<choices.length;j++){var active=j===selected;choices[j].classList.toggle('selected',active);choices[j].querySelector('.tick').textContent=active?'●':'○';choices[j].setAttribute('aria-pressed',active?'true':'false')}question.textContent=items[selected].question;response.value='';panel.classList.add('show');update()})}response.addEventListener('input',update);submit.addEventListener('click',function(){if(selected<0||response.value.trim().length<5)return;var message='☕ NELL BEFORE NOON — DAY III\nThe Saturday Confessional\n\nCategory: '+items[selected].title+'\nQuestion: '+items[selected].question+'\n\nNell’s answer:\n'+response.value;window.location.href='sms:'+phone+'?body='+encodeURIComponent(message)});update()})();</script></body></html>
