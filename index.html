:root{--green:#9cf5b0;--muted:#719b80;--line:#305941;--bg:#050b09}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#163023 0%,#060d0a 58%,#020403 100%);color:#d5ead8;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;min-height:100dvh}body:before{content:"";pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 4px 5px);z-index:4}.shell{max-width:700px;margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--green);font-size:11px;letter-spacing:1.5px}.light{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green);margin-right:7px;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35}}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fff;outline-offset:3px}.sound{border:1px solid var(--line);background:#102018;color:var(--green);border-radius:8px;padding:10px;font-size:11px}.panel{margin-top:18px;border:1px solid #39664a;background:linear-gradient(155deg,#102319ee,#07110ded);border-radius:15px;box-shadow:0 0 50px #0a2c1638,inset 0 0 60px #0006;overflow:hidden}.stripe{height:4px;background:linear-gradient(90deg,#193723,#9cf5b0,#193723)}.inner{padding:clamp(19px,5vw,34px)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);line-height:1.8}.title{font-size:clamp(27px,7vw,43px);line-height:1.1;margin:18px 0;color:#bafac7;text-shadow:0 0 24px #5eff9040}.sub{color:#aacbb1;line-height:1.75;font-size:14px}.divider{border:0;border-top:1px solid var(--line);margin:23px 0}.warning{border-left:3px solid #d2ad6a;padding:10px 14px;background:#3d321b35;color:#e7d2a6;font-size:12px;line-height:1.7;margin:22px 0}.primary{display:block;width:100%;border:1px solid #a1ffb7;background:#a2edb1;color:#08180d;border-radius:9px;padding:17px 14px;font-weight:900;letter-spacing:1px;margin-top:19px}.primary:disabled{opacity:.4;cursor:not-allowed}.secondary{border:1px solid var(--line);color:var(--green);background:#12251a;padding:13px;border-radius:9px}.choices{display:grid;gap:11px;margin:24px 0}.choice{width:100%;text-align:left;display:flex;gap:13px;align-items:flex-start;border:1px solid #3d674b;background:#102219;color:#e3f5e7;border-radius:9px;padding:17px 15px;line-height:1.55;font-size:14px}.choice b{color:var(--green)}.choice:hover,.choice:active{background:#1b3928;border-color:var(--green)}.reply{background:#193524;border:1px solid #3f8056;border-radius:10px;padding:18px;line-height:1.8;margin:20px 0}.progress{display:flex;gap:6px;margin:18px 0}.progress i{height:4px;flex:1;background:#254332;border-radius:9px}.progress i.done{background:#8be5a4}.tiny{font-size:11px;color:var(--muted);line-height:1.6}.status{font-size:12px;color:#f0c783}.ending{font-size:27px;color:var(--green);line-height:1.25;margin:16px 0}.cat{font-size:53px;text-align:center;margin:12px}.report{white-space:pre-wrap;overflow-wrap:anywhere;background:#050e09;padding:15px;border:1px solid var(--line);font-size:12px;line-height:1.65;border-radius:8px}.actions{display:grid;gap:10px;margin-top:18px}.hidden{display:none!important}.countdown{font-size:12px;color:#ffb7a2;letter-spacing:1px;margin-top:10px}.foot{text-align:center;margin:23px 0;color:#65866e;font-size:10px;letter-spacing:1px}.flash{animation:flash .4s ease}@keyframes flash{from{filter:brightness(2.3)}to{filter:brightness(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

'use strict';const PHONE='6082340286';const app=document.getElementById('app'),soundBtn=document.getElementById('sound');let soundOn=true,ctx=null,hum=null,stage=-1,answers=[],outcome='';const scenarios=[{title:'THE DISTRESS SIGNAL',text:'The Nostromo intercepts a mysterious signal from a nearby moon. Your crew wants to investigate. What do you do?',options:['Investigate. Curiosity is worth the risk.','Stay aboard. I have seen enough horror movies.','Ask why we are risking our lives for a corporation.'],feedback:['Curiosity logged. Corporate applauds your willingness to become a cautionary tale.','Self-preservation detected. Corporate finds your attitude disappointing.','Independent thought detected. Human Resources has opened a file.'],analysis:'Film studies note: The crew’s decision sets up the conflict between human survival and corporate interests.'},{title:'SOMETHING IN THE VENTS',text:'The motion tracker chirps. Something is moving in the ventilation system, and it is getting closer. Your move?',options:['Grab a flamethrower and go hunting.','Find a secure room and stay quiet.','Keep the crew together. Nobody goes alone.'],feedback:['Bold. Loud. Potentially delicious.','Caution registered. The organism respects no locked door.','Teamwork detected. An unfamiliar concept to this employer.'],analysis:'Film studies note: Sound, cramped spaces, and what the camera does NOT show are central to the suspense.'},{title:'THE FINAL ESCAPE',text:'The self-destruct sequence is active. The shuttle is almost ready. Then you hear a frightened meow. Jonesy is still aboard. What do you do?',options:['Get to the shuttle. I cannot risk another second.','Try to bring any surviving crew with me first.','GO BACK FOR JONESY. THE CAT IS COMING WITH ME.'],feedback:['Survival instinct confirmed. A tiny orange witness has filed a complaint.','Heroism detected. Corporate would prefer you protect the cargo.','WARNING: PRIORITY CONFLICT DETECTED. Crew member Nell has chosen to risk her life for one (1) orange cat. Survival probability: 12%. Emotional attachment: excessive. Corporate assessment: completely irrational. Personal assessment: GREEN FLAG DETECTED.'],analysis:'Film studies note: Ripley’s choice to rescue Jones makes the danger personal and highlights her compassion under pressure.'}];let selected=-1;
function audio(){if(!soundOn)return null;try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch{return null}}function tone(freq,dur=.12,type='sine',vol=.045,delay=0){const a=audio();if(!a)return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,.0002),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}function beep(){tone(690,.09,'square',.018);tone(980,.11,'sine',.026,.1)}function warning(){tone(190,.4,'sawtooth',.025);tone(140,.55,'sine',.035,.25)}function fanfare(){[523,659,784,1046].forEach((n,i)=>tone(n,.24,'sine',.045,i*.16))}function meow(){let a=audio();if(!a)return;let t=a.currentTime+.7,o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(850,t+.18);o.frequency.exponentialRampToValueAtTime(390,t+.65);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.035,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.71)}function startHum(){if(!soundOn||hum)return;let a=audio();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=58;g.gain.value=.009;o.connect(g).connect(a.destination);o.start();hum={o,g}}function stopHum(){if(hum){try{hum.o.stop()}catch{}hum.o.disconnect();hum.g.disconnect();hum=null}}soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'◖)) AUDIO ON':'◖)) AUDIO OFF';soundBtn.setAttribute('aria-pressed',String(soundOn));if(soundOn){beep();if(stage>=0)startHum()}else stopHum()};function header(n){return `<div class="eyebrow">MOTHER // CREW MEMBER NELL<br>INCIDENT FILE ${String(n).padStart(2,'0')} / 03</div><div class="progress">${scenarios.map((_,i)=>`<i class="${i<=n-1?'done':''}"></i>`).join('')}</div>`}function intro(){stage=-1;app.innerHTML=`<div class="eyebrow">INCOMING TRANSMISSION...<br>USCSS NOSTROMO // 2122</div><h1 class="title">XENOMORPH<br>SURVIVAL<br>ASSESSMENT</h1><p class="sub">CREW MEMBER: NELL<br>MISSION: ALIEN (1979)<br>STATUS: VIEWING COMPLETE</p><hr class="divider"><p class="sub">MOTHER has reviewed your personnel file. Three decisions stand between you and a very unpleasant encounter with an unidentified organism.</p><div class="warning">SPECIAL ORDER: SURVIVE IF CONVENIENT.<br>YOUR EMPLOYER MAKES NO GUARANTEES.</div><p class="tiny">Three interactive decisions. Multiple endings. Headphones recommended. Audio starts only when you begin.</p><button class="primary" id="begin">▶ INITIATE ASSESSMENT</button>`;document.getElementById('begin').onclick=()=>{beep();startHum();stage=0;renderStage()}}function renderStage(){selected=-1;let s=scenarios[stage];app.innerHTML=`${header(stage+1)}<h1 class="title">${s.title}</h1><p class="sub">${s.text}</p>${stage===2?'<div class="countdown">⚠ SELF-DESTRUCT SEQUENCE ACTIVE</div>':''}<div class="choices">${s.options.map((x,i)=>`<button class="choice" data-i="${i}"><b>${'ABC'[i]}.</b><span>${x}</span></button>`).join('')}</div><p class="tiny">SELECT ONE RESPONSE TO TRANSMIT TO MOTHER.</p>`;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);answers[stage]=selected;beep();if(stage===2)warning();renderFeedback()})}function renderFeedback(){let s=scenarios[stage];app.innerHTML=`${header(stage+1)}<div class="eyebrow">RESPONSE RECEIVED // MOTHER PROCESSING</div><h1 class="title">DECISION RECORDED</h1><div class="reply">${s.feedback[selected]}</div><p class="sub">${s.analysis}</p><button class="primary" id="next">${stage===2?'▶ REVEAL SURVIVAL REPORT':'▶ CONTINUE MISSION'}</button>`;document.getElementById('next').onclick=()=>{beep();if(stage===2)end();else{stage++;renderStage()}}}function reportText(){return `NELL AFTER DARK — XENOMORPH SURVIVAL ASSESSMENT\n\n${scenarios.map((s,i)=>`CASE FILE ${i+1}: ${s.title}\n${s.options[answers[i]]}`).join('\n\n')}\n\nFINAL RESULT: ${outcome}\n\n— Crew Member Nell`};function end(){stopHum();let cat=answers[2]===2,brave=answers[1]===0;outcome=cat?'THE CAT LADY PROTOCOL — SURVIVED. CAT RESCUED.':brave?'SURVIVAL UNCERTAIN — DANGEROUSLY BRAVE.':'SURVIVAL AUTHORIZED — CORPORATE DISAPPROVES.';if(cat){fanfare();meow()}else fanfare();app.innerHTML=`<div class="eyebrow">MOTHER // FINAL PERSONNEL EVALUATION</div><h1 class="title">MISSION COMPLETE</h1>${cat?'<div class="cat" aria-label="cat">🐈</div><div class="eyebrow">★ SECRET ACHIEVEMENT UNLOCKED ★</div>':''}<div class="ending">${outcome}</div><p class="sub">${cat?'You survived the Nostromo. You saved the cat. Weyland-Yutani considers you a liability. Ryan considers you a keeper.':'Nell has demonstrated a fascinating combination of survival instincts, questionable judgment, and excellent horror-movie potential.'}</p><div class="warning">SPECIAL ORDER 937:<br>CONTINUE GETTING TO KNOW NELL.<br>ALL OTHER PRIORITIES RESCINDED.</div><p class="tiny">MISSION REPORT — READY FOR TRANSMISSION TO RYAN</p><div class="report" id="report"></div><div class="actions"><button class="primary" id="send">✉ SEND MISSION REPORT</button><button class="secondary" id="copy">⧉ COPY MISSION REPORT</button><button class="secondary" id="again">↻ RESTART SIMULATION</button></div><p class="tiny" id="help">Android note: Send opens your SMS app. If the message is blank, tap Copy Mission Report and paste it into a text to Ryan. Sending always requires your confirmation.</p>`;document.getElementById('report').textContent=reportText();document.getElementById('send').onclick=()=>{const body=encodeURIComponent(reportText());window.location.href=`sms:${PHONE}?body=${body}`};document.getElementById('copy').onclick=async()=>{let t=reportText();try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='✓ COPIED — PASTE INTO A TEXT'}catch{let e=document.getElementById('report');let r=document.createRange();r.selectNodeContents(e);getSelection().removeAllRanges();getSelection().addRange(r);document.getElementById('copy').textContent='SELECTED — COPY TEXT MANUALLY'}};document.getElementById('again').onclick=()=>{answers=[];intro()}}intro();
</script></body></html>
