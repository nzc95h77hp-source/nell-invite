<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0d"><title>Nell After Dark — The Ritual Protocol</title><style>
:root{--bg:#080a0d;--panel:#11171a;--edge:#365058;--ink:#e4e9e5;--muted:#a1b1b3;--red:#ed4655;--green:#8fd5b5;--gold:#e4c58b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 50% 0,#1b2b30,#080a0d 60%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}body:before{content:"";pointer-events:none;position:fixed;inset:0;z-index:9;background:repeating-linear-gradient(transparent 0 3px,#0002 4px 5px);opacity:.22}.shell{max-width:780px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);margin-right:7px;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.3}}h1{font-family:Georgia,serif;font-size:clamp(36px,9vw,64px);line-height:.98;letter-spacing:1px;margin:25px 0 10px}h2{font-family:Georgia,serif;font-size:clamp(26px,6vw,37px);margin:8px 0 18px}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}p{line-height:1.65;color:#c6d0cf}.panel{border:1px solid var(--edge);border-radius:12px;background:linear-gradient(145deg,#172126,#0c1115);padding:clamp(18px,5vw,30px);box-shadow:0 20px 70px #0008}.warning{border-left:3px solid var(--red);padding:10px 14px;background:#551d2633;color:#e8b8bd;font-size:13px;line-height:1.6;margin:20px 0}.btn{border:1px solid #66818a;border-radius:8px;background:#23333a;color:#fff;font-weight:700;padding:15px 20px;cursor:pointer;font-size:15px;min-height:50px}.btn.primary{background:#8e2632;border-color:#df5664}.btn:disabled{opacity:.35;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(1.2)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.choice{display:block;width:100%;text-align:left;border:1px solid #34464c;border-radius:9px;background:#0c1317;color:#e4e9e5;padding:16px 17px;margin:9px 0;cursor:pointer;font-size:15px;line-height:1.45}.choice.selected{border-color:var(--gold);background:#2e2b23;box-shadow:inset 3px 0 var(--gold)}.choice:disabled{cursor:default}.choice.good{border-color:var(--green)}.choice.bad{border-color:var(--red)}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:0 0 14px}.bar{height:5px;background:#28373b;border-radius:20px;overflow:hidden;margin-bottom:25px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#ad3a48,#e2ba81);transition:width .3s}.feedback{margin-top:18px;border:1px solid #50646b;padding:15px;border-radius:8px;background:#101b20;line-height:1.6}.feedback strong{color:var(--gold)}.sub{font-size:13px;color:var(--muted)}.score{font-size:48px;font-family:Georgia,serif;color:var(--gold)}.hidden{display:none}.breach{animation:alarm 1.1s infinite}@keyframes alarm{50%{box-shadow:inset 0 0 100px #9b0a2444}}.stamp{display:inline-block;border:2px solid var(--red);color:#ff7c85;transform:rotate(-5deg);padding:9px 13px;font-weight:900;letter-spacing:2px;margin:15px 0}.footer{text-align:center;font-size:12px;color:#859599;margin-top:32px}.smallbtn{font-size:12px;padding:9px 12px;min-height:35px}.heart{color:var(--red)}.heartblack{color:#b0a8bb}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><main class="shell"><div class="top"><span><i class="led"></i>Facility Surveillance // Live</span><button id="sound" class="btn smallbtn" type="button">Sound: OFF</button></div><div id="app" aria-live="polite"></div><div class="footer">NELL AFTER DARK • CLASSIFIED EYES ONLY • 🖤 + ❤️</div></main><script>
'use strict';
const rounds=[
{stage:'I — THE CELLAR OF BAD DECISIONS',q:'Which specific act awakens the Buckner family?',a:['Dana reads aloud from Patience Buckner’s diary','Jules opens a puzzle box','Curt rings the cellar bell','Marty plays the music box'],c:[0],why:'Dana reads Patience Buckner’s Latin incantation from the diary. The objects are a menu of possible monsters, not merely decorations.'},
{stage:'I — THE CELLAR OF BAD DECISIONS',q:'What is the significance of the cellar’s collection of ominous objects?',a:['Each represents a possible creature or nightmare the victims might summon','They are props planted only to frighten the group','They contain the souls of previous victims','They are clues left by the Ancient Ones'],c:[0],why:'The victims’ interaction with an object determines which monster will be unleashed. The Facility does not simply choose the Buckners at random.'},
{stage:'I — THE CELLAR OF BAD DECISIONS',q:'Which two characters are revealed to have an existing romantic relationship?',a:['Dana and Holden','Jules and Curt','Marty and Dana','Jules and Holden'],c:[1],why:'Jules and Curt are a couple. The Facility pushes them into its prescribed archetypes.'},
{stage:'II — UNDER OBSERVATION',q:'Which combination of interventions helps manufacture the group’s stereotypical horror-film behavior? SELECT ALL THAT APPLY.',a:['Chemicals and pheromones','Manipulated environmental conditions','A hair-dye-related chemical change affecting Jules','Actual supernatural possession of all five friends'],c:[0,1,2],multi:true,why:'The Facility uses chemical, environmental and behavioral manipulation. The friends are not simply acting foolishly by nature.'},
{stage:'II — UNDER OBSERVATION',q:'Why is Marty unusually resistant to the Facility’s chemical influence?',a:['He secretly works for the Facility','His marijuana use interferes with the chemicals','He has already been sacrificed','He is protected by a spell'],c:[1],why:'Marty’s marijuana use makes him resistant to the Facility’s manipulation, undermining the Fool archetype.'},
{stage:'II — UNDER OBSERVATION',q:'What is the function of the one-way mirror in the cabin?',a:['It reveals a hidden observation room','It provides a voyeuristic view between Dana’s and Holden’s rooms','It lets the Buckners enter the cabin','It is the portal to the Ancient Ones'],c:[1],why:'Holden discovers the mirror and tells Dana about it, refusing the voyeuristic opportunity the setup offers.'},
{stage:'II — UNDER OBSERVATION',q:'Which ritual role is assigned to Holden?',a:['The Scholar','The Athlete','The Fool','The Virgin'],c:[0],why:'Holden is assigned the Scholar role, despite the film repeatedly complicating these simplified identities.'},
{stage:'III — RITUAL COMPLIANCE',q:'Under the American ritual’s rules, which statement is accurate?',a:['The Virgin must die first','All five must die in the order of their names','The Whore dies first; the Virgin must be last, and may survive','The Fool must be the final sacrifice'],c:[2],why:'The Whore must die first. The Virgin must be last, but her death is optional. The other three can die in any order.'},
{stage:'III — RITUAL COMPLIANCE',q:'Which character is designated the Virgin by the Facility?',a:['Jules','Dana','Marty','Holden'],c:[1],why:'Dana is the Virgin, a role the film treats as an imposed ritual category rather than an accurate biography.'},
{stage:'III — RITUAL COMPLIANCE',q:'What does the Facility’s betting pool reveal about the workers?',a:['They are ignorant of the stakes','They see the sacrifice as a routinized workplace spectacle','They are trying to save the victims','They are secretly competing against the Ancient Ones'],c:[1],why:'The wagers and office-party atmosphere turn horrific violence into bureaucratic entertainment, central to the movie’s satire.'},
{stage:'IV — CONTAINMENT BREACH',q:'Which creature is famously associated with Hadley’s frustrated wish to see it selected?',a:['The Merman','The Werewolf','The Giant Snake','The Sugarplum Fairy'],c:[0],why:'Hadley hopes to see a merman. The payoff arrives during the catastrophic containment breach.'},
{stage:'IV — CONTAINMENT BREACH',q:'How do Dana and Marty unleash the Facility’s imprisoned monsters?',a:['They break the Ancient Ones’ altar','They activate the system that releases the creatures from their containment cells','They read another incantation','They destroy the cabin’s force field'],c:[1],why:'They use the Facility’s control system to open the monster containment cells, turning its own machinery against its operators.'},
{stage:'IV — CONTAINMENT BREACH',q:'Which of these is NOT one of the five American ritual archetypes?',a:['The Athlete','The Scholar','The Harbinger','The Fool'],c:[2],why:'The Harbinger warns the group and is part of the horror machinery, but is not one of the five sacrificial roles.'},
{stage:'V — HORROR SCHOLAR EXAMINATION',q:'Which reading best explains the film’s use of horror stereotypes?',a:['It argues that horror characters are inherently unintelligent','It reveals the conventions as engineered demands of an audience-like system','It rejects all supernatural explanations','It claims slasher films have no consistent conventions'],c:[1],why:'The Facility engineers the tropes that viewers expect. The movie interrogates both genre formulas and the appetite for ritualized suffering.'},
{stage:'V — HORROR SCHOLAR EXAMINATION',q:'Which interpretation of the Ancient Ones is most strongly supported by the film’s meta-horror structure?',a:['They function partly as a stand-in for an audience demanding familiar sacrifice','They are literally the ghosts of previous directors','They represent the five students’ parents','They exist solely to explain the cabin’s geography'],c:[0],why:'One influential interpretation reads the Ancient Ones as the audience: a force that demands the established ritual of horror. It is an interpretation, not a literal plot fact.'},
{stage:'V — HORROR SCHOLAR EXAMINATION',q:'Why does the film’s final choice challenge a conventional heroic ending?',a:['It shows that the protagonists can simply escape without consequence','It forces a choice between killing a friend and allowing an apocalyptic outcome','It proves the Facility was benevolent all along','It reveals the entire film was a dream'],c:[1],why:'Dana and Marty refuse the logic of sacrifice, even though that refusal allows the Ancient Ones to rise. Their ethical choice is not a clean victory.'}
];
let i=0,score=0,answers=[],finalChoice=null,soundOn=false,audio=null,breached=false;
const app=document.getElementById('app'),soundBtn=document.getElementById('sound');
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function beep(type='tap'){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type=type==='alarm'?'sawtooth':'sine';o.frequency.setValueAtTime(type==='alarm'?190:type==='good'?620:320,now);o.frequency.exponentialRampToValueAtTime(type==='alarm'?85:type==='good'?850:160,now+.25);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(type==='alarm'?.095:.045,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.3);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+.32)}catch(e){}}
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF');if(soundOn)beep('good')};
function intro(){document.body.classList.remove('breach');app.innerHTML=`<section class="panel"><div class="eyebrow">Employee orientation // File CW-2012</div><h1>THE RITUAL<br>PROTOCOL</h1><p><strong>Agent Nell,</strong> your performance review has been moved up. The Facility requires proof that you were paying attention.</p><p>Sixteen brutal questions. No mercy for lazy horror analysis. The system will record every correct answer and explain every mistake.</p><div class="warning">SPOILER CLEARANCE REQUIRED: Complete the film before entering. Contains major plot details, creature reveals and the ending.</div><p class="sub">16 scored questions • single and multiple choice • 100-point scale • one final moral decision • optional sound</p><div class="controls"><button class="btn primary" id="start">ACCEPT ASSIGNMENT</button></div></section>`;document.getElementById('start').onclick=()=>{beep();render()}}
function render(){const q=rounds[i];const prev=answers[i]||{sel:[],locked:false};const pct=Math.round(i/rounds.length*100);if(i>=10&&!breached){breached=true;document.body.classList.add('breach');beep('alarm')}app.innerHTML=`<section class="panel"><div class="meta"><span>Agent Nell // ${escapeHtml(q.stage)}</span><span>${i+1} / ${rounds.length}</span></div><div class="bar"><span style="width:${pct}%"></span></div>${i===10?'<div class="warning">⚠ CONTAINMENT BREACH. ALL DEPARTMENTS REPORT TO YOUR DOOM.</div>':''}<div class="eyebrow">${q.multi?'MULTIPLE SELECTIONS REQUIRED':'SINGLE ANSWER REQUIRED'} • ${i>=13?'ADVANCED ANALYSIS':'CLASSIFIED KNOWLEDGE'}</div><h2>${escapeHtml(q.q)}</h2><div id="choices">${q.a.map((v,k)=>`<button class="choice ${prev.sel.includes(k)?'selected':''} ${prev.locked&&q.c.includes(k)?'good':''} ${prev.locked&&prev.sel.includes(k)&&!q.c.includes(k)?'bad':''}" data-opt="${k}" ${prev.locked?'disabled':''}>${String.fromCharCode(65+k)}. ${escapeHtml(v)}${prev.locked&&q.c.includes(k)?' ✓':''}</button>`).join('')}</div><div id="feedback">${prev.locked?feedback(q,prev):''}</div><div class="controls"><button class="btn primary" id="confirm" ${!prev.sel.length||prev.locked?'disabled':''}>VERIFY RESPONSE</button><button class="btn" id="next" ${prev.locked?'':'disabled'}>${i===rounds.length-1?'FINAL SACRIFICE':'NEXT FILE →'}</button></div><p class="sub">${q.multi?'Select all correct answers, then verify.':'Select one answer, then verify.'} Each response locks after verification.</p></section>`;document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const k=Number(b.dataset.opt),current=answers[i]||{sel:[],locked:false};if(current.locked)return;current.sel=q.multi?(current.sel.includes(k)?current.sel.filter(x=>x!==k):[...current.sel,k]):[k];answers[i]=current;beep();render()});document.getElementById('confirm').onclick=()=>{let a=answers[i];if(!a||!a.sel.length||a.locked)return;a.locked=true;a.correct=a.sel.length===q.c.length&&a.sel.every(x=>q.c.includes(x));if(a.correct){score++;beep('good')}else beep('alarm');render()};document.getElementById('next').onclick=()=>{beep();if(i===rounds.length-1)endingChoice();else{i++;render()}}}
function feedback(q,a){return `<div class="feedback"><strong>${a.correct?'✓ RITUAL KNOWLEDGE VERIFIED':'✕ ANALYST ERROR LOGGED'}</strong><br>${escapeHtml(q.why)}</div>`}
function endingChoice(){app.innerHTML=`<section class="panel"><div class="eyebrow">Final evaluation // No correct answer</div><h1>THE FINAL<br>SACRIFICE</h1><p>The Facility has fallen. The Ancient Ones are stirring. You have one decision left.</p><h2>Would you sacrifice Marty to save humanity?</h2><button class="choice" id="save">A. Yes. One life for the rest of the world.</button><button class="choice" id="refuse">B. No. The world can face the consequences of its own monstrous ritual.</button><p class="sub">Your decision determines your ending. This is an ethical interpretation, not a graded trivia question.</p></section>`;document.getElementById('save').onclick=()=>{finalChoice='save';beep('alarm');results()};document.getElementById('refuse').onclick=()=>{finalChoice='refuse';beep('alarm');results()}}
function results(){const percent=Math.round(score/rounds.length*100);const rank=percent>=88?'SENIOR RITUAL ARCHITECT':percent>=69?'CONTAINMENT SPECIALIST':percent>=50?'JUNIOR HORROR ANALYST':'EXPENDABLE INTERN';const ending=finalChoice==='save'?{title:'THE MACHINE CONTINUES',body:'You choose the world over one person. The Facility would approve. But if survival requires the ritual to continue, what exactly have you saved?'}:percent>=75?{title:'THE ANCIENT ONES AWAKEN',body:'You refuse the sacrifice. The world may end, but the old rules end with it. The Facility has never encountered a more dangerous horror scholar.'}:{title:'THE LAST TRANSMISSION',body:'You reject the ritual. The ground shakes. The monitors go dark. Your final report contains one sentence: perhaps humanity should have written a better story.'};app.innerHTML=`<section class="panel"><div class="eyebrow">Facility terminal report // Declassified</div><div class="stamp">${escapeHtml(rank)}</div><h1>${escapeHtml(ending.title)}</h1><div class="score">${percent}%</div><p>${score} of ${rounds.length} questions answered correctly.</p><p>${escapeHtml(ending.body)}</p><div class="warning">PERSONNEL NOTE: Agent Nell demonstrates a deeply concerning level of horror literacy. Recommend continued surveillance and significantly more movie nights.</div><p>And for the record, Nell: I love getting to see the world of horror through your eyes. Your brain is ridiculously attractive, and I hope this little nightmare made your evening a bit more fun. <span class="heartblack">🖤</span><span class="heart">❤️</span></p><div class="controls"><button class="btn primary" id="copy">COPY MY FACILITY REPORT</button><button class="btn" id="again">RESTART THE RITUAL</button></div><p id="copyStatus" class="sub"></p></section>`;document.getElementById('again').onclick=()=>{i=0;score=0;answers=[];breached=false;finalChoice=null;intro()};document.getElementById('copy').onclick=async()=>{const s=`NELL AFTER DARK — THE RITUAL PROTOCOL\nScore: ${score}/${rounds.length} (${percent}%)\nClearance: ${rank}\nEnding: ${ending.title}\nFinal decision: ${finalChoice==='save'?'Sacrifice Marty':'Refuse the sacrifice'}\n🖤❤️`;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);document.getElementById('copyStatus').textContent='Report copied. Paste it into a message if you want!'}else{const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();document.getElementById('copyStatus').textContent=ok?'Report copied. Paste it into a message if you want!':'Copy unavailable. You can screenshot your report.'}}catch(e){document.getElementById('copyStatus').textContent='Copy unavailable. You can screenshot your report.'}}}
intro();
</script></body></html>
