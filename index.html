at(9-state.lives)}</p><button class="primary" id="next">Examine the evidence →</button>`;document.getElementById('next').onclick=()=>{state.stage='question';beep();render()};return}if(state.stage==='question'){const q=Q[state.order[state.i]],ch=q[0],num=state.i+1;el.innerHTML=`<div class="top"><span class="eyebrow">${esc(chapters[ch])}</span><span class="stat">${num} / ${state.order.length}</span></div><div class="track"><div class="fill" style="width:${num/state.order.length*100}%"></div></div><div class="top"><span class="stat">🐾 ${state.score} points</span><span class="stat">${'♥'.repeat(state.lives)}${'♡'.repeat(9-state.lives)}</span></div><h2>${esc(q[1])}</h2><div id="options"></div><div id="feedback"></div><button class="primary" id="submit" disabled>Submit evidence</button>`;let opts=shuffle(q[2].map((v,i)=>({v,i})));let options=document.getElementById('options');opts.forEach((o,k)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="letter">${'ABCD'[k]}</span><span>${esc(o.v)}</span>`;b.onclick=()=>{if(state.shown)return;state.pick=o.i;options.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('submit').disabled=false;beep()};options.appendChild(b)});document.getElementById('submit').onclick=()=>{if(!state.shown){if(state.pick===null)return;state.shown=true;let ok=state.pick===q[3];if(ok){state.score+=10;state.correct++;beep('good')}else{state.lives=Math.max(0,state.lives-1);beep('bad')}options.querySelectorAll('button').forEach(b=>{b.disabled=true;let answer=b.querySelector('span:last-child').textContent;if(answer===q[2][q[3]])b.classList.add('correct');else if(answer===q[2][state.pick])b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="reveal"><div class="result">${ok?'✓ THE COUNCIL APPROVES':'✕ THE COUNCIL HISSES'}</div><p>${esc(q[4])}</p><div class="sources small"><a href="${q[5]}" target="_blank" rel="noopener noreferrer">Explore the source ↗</a></div></div>`;let b=document.getElementById('submit');b.textContent=state.i===state.order.length-1?'Receive final verdict →':'Continue investigation →';if(state.lives===0)document.getElementById('feedback').insertAdjacentHTML('beforeend','<p class="small muted">All nine lives spent. The Council grudgingly allows you to finish.</p>')}else{state.i++;state.pick=null;state.shown=false;if(state.i>=state.order.length){state.stage='end';meow()}else if(Q[state.order[state.i]][0]!==ch){state.stage='chapter';beep('chapter')}render()}};return}let pct=Math.round(state.correct/state.order.length*100),rank=pct>=90?'CERTIFIED FELINE OVERLORD':pct>=70?'SUSPICIOUSLY KNOWLEDGEABLE CAT LADY':pct>=45?'HONORARY CAT CONSPIRACY INVESTIGATOR':'HUMAN SERVANT, THIRD CLASS';el.innerHTML=`<div class="eyebrow">Official ruling • Cat Council</div><div class="cat">👑🐈‍⬛</div><h1>Final Verdict</h1><div class="stamp"><div class="eyebrow">This certifies that Nell is</div><h2>${rank}</h2><p>${state.correct} / ${state.order.length} correct • ${state.score} points<br>${state.lives} of 9 lives remaining</p></div><p>Congratulations, human. You have demonstrated sufficient knowledge to remain in our service. Your continued existence has been approved. <em>For now.</em></p><button class="primary" id="again">Reopen the Feline Files ↻</button><p class="small muted">Questions reshuffle on replay. Sound effects are synthesized on your device; no audio files or internet connection needed once loaded.</p>`;document.getElementById('again').onclick=()=>{state={...state,stage:'intro',i:0,pick:null,lives:9,score:0,correct:0,shown:false,order:[]};render()}}
