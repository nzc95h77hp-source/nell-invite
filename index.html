<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160e16"><title>Nell After Dark — Rainy Night Protocol</title><style>
:root{--cream:#f6e8d4;--muted:#c5aeb5;--rose:#e4a7ac;--gold:#e9bc82}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--cream);background:#130d15}body{overflow-x:hidden}.scene{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at 73% 78%,#6d3a35 0%,transparent 35%),radial-gradient(ellipse at 10% 20%,#3b263c 0%,transparent 48%),linear-gradient(130deg,#0b111c,#291520 70%,#130d15)}.window{position:fixed;inset:0;z-index:-2;opacity:.42;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 25px,rgba(193,206,235,.13) 26px 27px,transparent 28px 75px);animation:rain 1.8s linear infinite}.window:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 90px,rgba(225,229,250,.24) 92px 93px,transparent 94px 185px);animation:rain 3s linear infinite}@keyframes rain{from{transform:translateY(-100px)}to{transform:translateY(100px)}}.flash{position:fixed;inset:0;background:#d9e5ff;opacity:0;pointer-events:none;z-index:-1;animation:lightning 23s infinite}@keyframes lightning{0%,88%,89%,90%,100%{opacity:0}88.3%,89.3%{opacity:.12}}.wrap{max-width:600px;margin:auto;padding:24px 18px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font:11px system-ui,sans-serif;letter-spacing:3px;color:#d9a5ac;text-transform:uppercase}.sound{border:1px solid #8e6672;border-radius:50px;background:#2a1c2a;color:var(--cream);padding:10px 14px;font:12px system-ui,sans-serif;cursor:pointer}.panel{margin-top:35px;padding:clamp(25px,6vw,45px) clamp(20px,5vw,40px);border:1px solid rgba(236,179,152,.33);border-radius:22px;background:linear-gradient(150deg,rgba(53,28,44,.94),rgba(21,17,29,.95));box-shadow:0 20px 65px #0008, inset 0 0 80px #8c463017;backdrop-filter:blur(6px);min-height:460px}.eyebrow{font:11px system-ui,sans-serif;letter-spacing:2.7px;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(38px,9vw,61px);line-height:1.06;font-weight:normal;margin:18px 0 22px}h2{font-size:clamp(30px,7vw,42px);line-height:1.14;font-weight:normal;margin:17px 0 16px}.lead{font-size:18px;line-height:1.7;color:#ead8d6}.note{color:var(--muted);font-size:14px;line-height:1.65}.line{height:1px;background:linear-gradient(90deg,transparent,#c08c7c,transparent);margin:26px 0}.btn{display:block;width:100%;border:1px solid #e8b49b;background:linear-gradient(135deg,#a35462,#73384f);color:#fff5e9;border-radius:12px;padding:17px 16px;font:600 13px system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;min-height:54px}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.secondary{background:transparent;border-color:#8e6572;margin-top:12px}.choices{display:grid;gap:12px;margin:25px 0}.choice{display:flex;gap:13px;align-items:flex-start;text-align:left;background:#ffffff09;border:1px solid #ffffff30;color:var(--cream);border-radius:13px;padding:16px;font:16px/1.5 Georgia,serif;cursor:pointer;min-height:64px}.choice strong{color:var(--gold);font:700 12px system-ui,sans-serif;margin-top:4px}.choice.selected{background:#8b48534a;border-color:#efb6a4;box-shadow:0 0 0 1px #efb6a440}.progress{display:flex;gap:6px;margin:20px 0 4px}.dot{height:3px;background:#6e5360;border-radius:4px;flex:1}.dot.on{background:#edb28e}.hide{display:none!important}.summary{padding:17px;border:1px solid #c89a8b77;border-radius:12px;background:#0003;white-space:pre-line;line-height:1.75;font-size:15px}.footer{text-align:center;color:#b28c97;font:11px system-ui,sans-serif;letter-spacing:1px;margin-top:22px}.heart{text-align:center;font-size:42px;color:#edb3ac;margin:25px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f4e2d5;color:#2a1520;padding:12px 18px;border-radius:9px;font:13px system-ui,sans-serif;display:none;z-index:5}a{color:#ffe0b7}button:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(prefers-reduced-motion:reduce){.window,.window:after,.flash{animation:none}}
</style></head><body><div class="scene"></div><div class="window"></div><div class="flash"></div><main class="wrap"><div class="top"><span class="brand">Nell After Dark · October 15</span><button class="sound" id="sound" type="button">♫ Enable rain</button></div><section class="panel"><div id="app" aria-live="polite"></div></section><div class="footer">A LITTLE RAIN. A LITTLE MAGIC. A NIGHT FOR TWO.</div></main><div class="toast" id="toast" role="status"></div><script>
const questions=[
{title:'The Blanket Situation',intro:'It’s raining. The movie is queued. There is one oversized blanket. What’s the arrangement?',choices:['Separate corners. We’re civilized.','Shared blanket, accidental cuddling.','You’re the pillow. I’ve decided.','We’re not pretending personal space exists.']},
{title:'The Movie Selection',intro:'The remote is yours. What are we watching?',choices:['Something terrifying so I have an excuse to grab you.','A comfort movie we’ve seen a hundred times.','A terrible horror movie we can make fun of.','Honestly, the movie is just background noise.']},
{title:'The Unwritten Rule',intro:'Every perfect blanket night has one unwritten rule. What’s yours?',choices:['No phones. Just us.','Whoever gets up has to bring back snacks.','Cuddling is mandatory. Complaints go to management.','Kisses are permitted to interrupt the movie.']},
{title:'The Dangerous Question',intro:'The credits roll. The rain hasn’t stopped. Neither of us is moving. What happens next?',choices:['One more movie. Obviously.','We stay exactly where we are and talk for hours.','I move a little closer and see what happens.','I think we’ve both forgotten what we were watching.']},
{title:'After the Credits',intro:'One last thing. The room is quiet, the rain is still falling, and you could freeze one moment from this night. Which one would you keep?',choices:['The first time we settle in and everything feels easy.','The quiet moment when neither of us needs to say anything.','Laughing together at something only we would find funny.','The moment I realize I don’t want the night to end.']}
];
const app=document.getElementById('app'),answers=Array(5).fill(null);let stage=-1,unlocked=false;const phone='6082340286';
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(label,id,disabled=false,secondary=false){return `<button class="btn ${secondary?'secondary':''}" id="${id}" ${disabled?'disabled':''}>${label}</button>`}
function render(){if(stage===-1){app.innerHTML=`<div class="eyebrow">☾ An invitation for Nell</div><h1>The Rainy Night<br>Protocol</h1><p class="lead">Outside, the world is cold and rainy. Inside, there’s a couch, one very good blanket, and a movie we may or may not finish.</p><div class="line"></div><p class="note">Tonight, you’re in charge of the perfect rainy night for two. Four little decisions. No wrong answers. And maybe one secret waiting after the credits.</p>${button('Enter the cozy zone →','next')}<p class="note" style="text-align:center">Optional: turn on the rain above for the full atmosphere.</p>`;document.getElementById('next').onclick=()=>{stage=0;render()};return;}
if(stage===4&&!unlocked){app.innerHTML=`<div class="eyebrow">✦ All four scenes complete</div><h2>But wait…</h2><p class="lead">The credits have rolled. The screen goes dark. The rain keeps falling.</p><div class="heart">♡</div><p class="lead">There’s one final scene. No tricks. No scares. Just something worth keeping.</p>${button('Unlock: After the Credits ♡','unlock')}`;document.getElementById('unlock').onclick=()=>{unlocked=true;render()};return;}
if(stage>=5){const summary=makeSummary();app.innerHTML=`<div class="eyebrow">♡ Rainy night protocol complete</div><h2>Forecast: Us.</h2><p class="lead">Heavy cuddling. Scattered kisses. Zero chance of wanting the night to end.</p><div class="line"></div><p class="note">Your official rainy-night prescription:</p><div class="summary" id="summary"></div><p class="lead" style="text-align:center">Some storms are better weathered together. ♡</p>${button('Text my forecast to Ryan ↗','send')}${button('Copy my answers','copy',false,true)}${button('Play again ↺','restart',false,true)}<p class="note">Your phone may ask you to confirm the recipient or tap Send. If texting doesn't carry the message over, use Copy my answers and paste into your conversation.</p>`;document.getElementById('summary').textContent=summary;document.getElementById('send').onclick=()=>{const message=encodeURIComponent(summary);window.location.href='sms:'+phone+'?body='+message};document.getElementById('copy').onclick=()=>copy(summary);document.getElementById('restart').onclick=()=>{answers.fill(null);stage=-1;unlocked=false;render()};return;}
const q=questions[stage];app.innerHTML=`<div class="eyebrow">${stage===4?'♡ Secret scene':'Scene '+(stage+1)+' of 4'}</div><div class="progress">${questions.map((_,i)=>`<span class="dot ${i<=stage?'on':''}"></span>`).join('')}</div><h2>${esc(q.title)}</h2><p class="lead">${esc(q.intro)}</p><div class="choices">${q.choices.map((c,i)=>`<button class="choice ${answers[stage]===i?'selected':''}" data-i="${i}" aria-pressed="${answers[stage]===i}"><strong>${'ABCD'[i]}.</strong><span>${esc(c)}</span></button>`).join('')}</div>${button(stage===4?'Seal the moment ♡':'Lock in this scene →','next',answers[stage]===null)}${stage>0?button('← Previous scene','back',false,true):''}`;
app.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{answers[stage]=Number(el.dataset.i);render()});document.getElementById('next').onclick=()=>{if(answers[stage]!==null){stage++;render();window.scrollTo({top:0,behavior:'smooth'})}};const back=document.getElementById('back');if(back)back.onclick=()=>{stage--;render()};}
function makeSummary(){return 'NELL AFTER DARK — THE RAINY NIGHT PROTOCOL 🌧️🖤\n\n'+questions.map((q,i)=>`${i===4?'♡':i+1+'.'} ${q.title}\n${'ABCD'[answers[i]]}. ${q.choices[answers[i]]}`).join('\n\n')+'\n\nForecast: Some storms are better weathered together. ♡';}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2700)}
async function copy(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);toast('Copied! Paste into a text to Ryan.');return}}catch(e){}const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');toast('Copied! Paste into a text to Ryan.')}catch(e){toast('Select and copy your answers above.')}ta.remove()}
let audioCtx,noise,filter,gain,thunderTimer,soundOn=false;const soundBtn=document.getElementById('sound');soundBtn.onclick=async()=>{if(soundOn){soundOn=false;if(gain)gain.gain.setTargetAtTime(0,audioCtx.currentTime,.2);clearInterval(thunderTimer);soundBtn.textContent='♫ Enable rain';return}try{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();const size=audioCtx.sampleRate*3,buf=audioCtx.createBuffer(1,size,audioCtx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<size;i++)data[i]=Math.random()*2-1;noise=audioCtx.createBufferSource();noise.buffer=buf;noise.loop=true;filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=950;gain=audioCtx.createGain();gain.gain.value=0;noise.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);noise.start()}await audioCtx.resume();soundOn=true;gain.gain.setTargetAtTime(.24,audioCtx.currentTime,.4);soundBtn.textContent='♫ Rain on · mute';thunderTimer=setInterval(()=>{if(!soundOn||Math.random()>.55)return;const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(55,now);osc.frequency.exponentialRampToValueAtTime(28,now+2.3);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.06,now+.3);g.gain.exponentialRampToValueAtTime(.0001,now+3.2);osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+3.3)},15000)}catch(e){toast('Sound is unavailable on this browser.')}};render();
</script></body></html>
