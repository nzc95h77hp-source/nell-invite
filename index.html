<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17141d"><title>Nell Before Noon — The Morning Heart Heist</title><style>
:root{color-scheme:dark;font-family:Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 5%,#493044 0%,#211a29 45%,#100e17 100%);color:#f6e6e9;display:grid;place-items:center;padding:22px;overflow-x:hidden}.card{position:relative;width:min(100%,440px);padding:26px 22px 30px;border:1px solid #9e697b80;border-radius:24px;background:linear-gradient(145deg,#302432ed,#17131fee);box-shadow:0 24px 75px #0009;text-align:center;overflow:hidden}.eyebrow{font:11px system-ui,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#d5a5b6}.art{height:155px;display:grid;place-items:center;position:relative}.moon{position:absolute;top:12px;right:45px;font-size:32px;color:#e7b9cb;opacity:.7}.hearts{font-size:76px;filter:drop-shadow(0 0 18px #df496966);animation:float 3.8s ease-in-out infinite}.hearts span+span{margin-left:-28px;position:relative;top:13px}h1{font-size:clamp(27px,7vw,35px);line-height:1.18;margin:0 0 12px}p{line-height:1.6;color:#e5cedb}.message{min-height:112px;display:grid;place-items:center;font-size:20px;line-height:1.5;padding:12px 4px;animation:appear .5s ease}.button{border:1px solid #f3b4c2;border-radius:999px;background:linear-gradient(110deg,#a43b60,#d2566a);color:white;padding:16px 24px;width:100%;font:600 15px system-ui,sans-serif;cursor:pointer;min-height:54px;box-shadow:0 8px 24px #b3415955}.button:active{transform:scale(.98)}.button:focus-visible{outline:3px solid white;outline-offset:3px}.footer{margin-top:18px;font:12px system-ui,sans-serif;color:#c6a4b7}.hidden{display:none}.float-heart{position:fixed;bottom:-50px;pointer-events:none;animation:rise var(--dur) linear forwards;font-size:var(--size);left:var(--left);opacity:.8;z-index:5}.final{font-size:26px;font-weight:bold;color:#ffc2d1}.hint{font:12px system-ui,sans-serif;color:#b99dab;margin-top:12px}@keyframes float{50%{transform:translateY(-9px)}}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes rise{to{transform:translateY(-115vh) rotate(35deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="card"><div class="eyebrow">Nell Before Noon · October 21</div><div class="art"><div class="moon">☾</div><div class="hearts" aria-hidden="true"><span>🖤</span><span>❤️</span></div></div><h1>Good Morning,<br>Beautiful. 🖤</h1><p id="intro">Someone has been thinking about you again.</p><div id="message" class="message" aria-live="polite">A little something is waiting for you…</div><button id="next" class="button" type="button">❤️ Steal My First Smile</button><div class="hint" id="hint">Tap to unwrap your morning surprise</div><div class="footer">A tiny morning heart heist, just for Nell ❤️🖤</div></main><script>
(()=>{'use strict';let stage=0;const messages=['A little something is waiting for you…',"You've officially stolen my first smile of the day. ❤️","I'd much rather be stealing a kiss from you right now. 🖤","No matter what today throws at you, there's someone out here who's ridiculously happy you exist. ❤️🖤",'<span class="final">You Are My Person. ❤️🖤</span>'];const labels=['❤️ Steal My First Smile','🖤 Steal Another','❤️ One Last Surprise','❤️🖤 Open Your Heart','↻ Experience It Again'];const msg=document.getElementById('message'),btn=document.getElementById('next'),hint=document.getElementById('hint');let audio;function chime(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();[392,523.25,659.25].forEach((freq,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.11;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.065,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.51)})}catch(e){}}function hearts(count){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<count;i++){const h=document.createElement('span');h.className='float-heart';h.textContent=i%2?'🖤':'❤️';h.style.setProperty('--left',Math.random()*100+'vw');h.style.setProperty('--size',(13+Math.random()*20)+'px');h.style.setProperty('--dur',(3+Math.random()*3)+'s');document.body.appendChild(h);setTimeout(()=>h.remove(),6500)}}btn.addEventListener('click',()=>{stage=stage===4?0:stage+1;msg.innerHTML=messages[stage];btn.textContent=labels[stage];hint.textContent=stage===4?'Made with all my heart.':stage===0?'Tap to unwrap your morning surprise':'There’s a little more waiting for you…';chime();hearts(stage===4?24:9)});})();
</script></body></html>
