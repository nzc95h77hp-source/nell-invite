<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#150f17"><title>Nell Before Noon • Road Trip Roulette</title><style>:root{color-scheme:dark;--cream:#f4e5ce;--red:#c84a59}*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:Georgia,serif;color:var(--cream);background:radial-gradient(ellipse at 50% 25%,#51303a,#160f1a 70%);overflow-x:hidden}.sky{position:fixed;inset:0;pointer-events:none;transition:background 1.2s;background:linear-gradient(#75506488,#201d3288 55%,#090c13)}body[data-scene="1"] .sky{background:linear-gradient(#7e596688,#b36c4a44 50%,#10111a)}body[data-scene="2"] .sky{background:linear-gradient(#48495b99,#293b4788 55%,#080d15)}body[data-scene="3"] .sky,body[data-scene="4"] .sky{background:linear-gradient(#080d21dd,#211a2bbb 65%,#05070c)}.stars{position:fixed;inset:0;pointer-events:none;opacity:0;background-image:radial-gradient(1px 1px at 12% 16%,white 90%,transparent),radial-gradient(2px 2px at 68% 22%,white 90%,transparent),radial-gradient(1px 1px at 85% 9%,white 90%,transparent),radial-gradient(1px 1px at 40% 32%,white 90%,transparent);transition:opacity 1s}body[data-scene="3"] .stars,body[data-scene="4"] .stars{opacity:.8}.road{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(96vw,760px);height:35vh;clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);background:linear-gradient(90deg,#18151c,#302b32 50%,#17151c);opacity:.45;pointer-events:none}.road:after{content:"";position:absolute;left:49%;width:2%;height:100%;background:repeating-linear-gradient(to bottom,#d9b99b 0 24px,transparent 24px 65px);animation:drive 2s linear infinite}@keyframes drive{to{background-position:0 65px}}main{position:relative;max-width:610px;margin:auto;padding:24px 18px 70px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:11px system-ui;letter-spacing:2px;text-transform:uppercase;color:#f2b8b8}.sound{border:1px solid #ffffff55;border-radius:30px;padding:10px 14px;background:#17121bbd;color:var(--cream);font:12px system-ui}.panel{margin-top:24px;border:1px solid #e8c5ac55;border-radius:19px;background:#160f1de8;box-shadow:0 22px 75px #0009;padding:clamp(22px,6vw,38px);backdrop-filter:blur(9px)}.eyebrow{font:11px system-ui;letter-spacing:3px;color:#e8a2a9;text-transform:uppercase}h1{font-size:clamp(34px,9vw,58px);line-height:1.04;margin:16px 0 18px;font-weight:normal}h2{font-size:clamp(27px,7vw,39px);font-weight:normal;line-height:1.15;margin:15px 0}p{line-height:1.65;color:#e1cfc9}.options{display:grid;gap:10px;margin:24px 0}.option{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border:1px solid #9c7c8355;border-radius:12px;background:#332632aa;color:var(--cream);font:15px/1.4 system-ui;min-height:64px;cursor:pointer}.option.selected{border-color:#f4b6a6;background:#6a3544;box-shadow:inset 0 0 0 1px #f4b6a6}.option .emoji{font-size:23px;min-width:29px}.cta{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,#bd5362,#873346);padding:17px;color:white;font:bold 13px system-ui;letter-spacing:2px;cursor:pointer;min-height:55px}.cta:disabled{opacity:.38;cursor:not-allowed}.hint{font:12px/1.5 system-ui;color:#cdb5b7;margin-top:12px}.progress{display:flex;gap:7px;margin-top:23px}.progress span{height:3px;background:#7d626a;flex:1;border-radius:4px}.progress span.active{background:#f0a6a9}.foot{font:11px system-ui;letter-spacing:1px;text-align:center;margin-top:24px;color:#b99da5}.hidden{display:none}.report{white-space:pre-line;background:#271e2a;border:1px solid #ffffff22;padding:17px;border-radius:12px;font:13px/1.7 system-ui;margin:20px 0;max-height:35vh;overflow:auto}a{color:#f7bec2}.small{font-size:12px}</style></head><body data-scene="0"><div class="sky"></div><div class="stars"></div><div class="road"></div><main><div class="top"><span>Nell Before Noon · Day 12</span><button id="sound" class="sound" type="button">♫ Sound off</button></div><section class="panel" id="panel" aria-live="polite"></section><div class="foot">MADE FOR NELL · 🖤 + ❤️ · NO GPS REQUIRED</div></main><script>
const questions=[{title:'The Great Escape',scene:'MORNING · MILE 001',lead:'Full tank. Snacks acquired. Absolutely nowhere we have to be. Where are we heading?',multi:false,opts:[['🌲','Into the mountains and wilderness'],['🏚️','Creepy little towns and roadside oddities'],['🌊','Somewhere with water and sunsets'],['🎲','No destination. Just drive and see what happens']]},{title:'The Passenger Seat DJ',scene:'LATE MORNING · RADIO ON',lead:'You have complete control of the music. What’s our soundtrack?',multi:true,opts:[['🎸','Loud music and terrible singing'],['🖤','Dark, moody, atmospheric music'],['🎶','A chaotic playlist with absolutely no consistency'],['🎙️','True crime podcasts until we’re suspicious of everyone']]},{title:'The Unplanned Detour',scene:'AFTERNOON · NEXT EXIT',lead:'Four signs appear along the highway. Which ones are we stopping for?',multi:true,opts:[['👻','Haunted hotel — 2 miles'],['🐈','Cat rescue café — next exit'],['🦕','World’s largest something ridiculous'],['🥧','Homemade pie and coffee — open 24 hours']]},{title:'Midnight on the Highway',scene:'MIDNIGHT · NO SIGNAL',lead:'It’s late. We’re miles from home. What’s your favorite part?',multi:true,opts:[['✨','Deep conversations that happen out of nowhere'],['🤝','Comfortable silence with the right person'],['😂','Laughing so hard we miss our exit'],['🖤','The feeling that we don’t have to be anywhere else']]},{title:'The Final Destination',scene:'2:13 AM · LAST STOP',lead:'We finally stop for the night. Where are we staying?',multi:false,opts:[['🏕️','A cabin hidden in the woods'],['🏨','A suspiciously charming roadside motel'],['🌌','Somewhere we can watch the stars'],['🏰','An old, allegedly haunted bed-and-breakfast']]}];
let step=-1,answers=questions.map(()=>[]),soundOn=false,ctx=null,master=null,noiseSource=null,noiseGain=null,oscillators=[],rainTimer=null;const panel=document.getElementById('panel'),soundButton=document.getElementById('sound');
function initAudio(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.22;master.connect(ctx.destination);const len=ctx.sampleRate*2,buffer=ctx.createBuffer(1,len,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<len;i++)data[i]=Math.random()*2-1;noiseSource=ctx.createBufferSource();noiseSource.buffer=buffer;noiseSource.loop=true;const low=ctx.createBiquadFilter();low.type='lowpass';low.frequency.value=320;noiseGain=ctx.createGain();noiseGain.gain.value=.045;noiseSource.connect(low);low.connect(noiseGain);noiseGain.connect(master);noiseSource.start();for(const freq of [52,78]){let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.025;o.connect(g);g.connect(master);o.start();oscillators.push(o)}}function tone(freq,duration=.18,type='sine',vol=.1){if(!ctx||!soundOn)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+duration+.02)}function transitionSound(){tone(180,.15,'sawtooth',.055);setTimeout(()=>tone(110,.25,'triangle',.06),110)}function sceneSound(){if(!ctx)return;noiseGain.gain.setTargetAtTime(step>=3?.14:step===2?.08:.045,ctx.currentTime,.4);if(step===4){tone(120,.8,'sawtooth',.09);setTimeout(()=>tone(80,1,'sine',.09),200)}}function startAudio(){initAudio();if(ctx)ctx.resume();soundOn=!!ctx;soundButton.textContent=soundOn?'♫ Sound on':'♫ Sound unavailable';sceneSound()}soundButton.addEventListener('click',()=>{if(!soundOn){startAudio()}else{soundOn=false;ctx?.suspend();soundButton.textContent='♫ Sound off'}});
function render(){document.body.dataset.scene=String(Math.max(0,step));if(step===-1){panel.innerHTML='<div class="eyebrow">An invitation to get gloriously lost</div><h1>THE ROAD TRIP<br>ROULETTE</h1><p>Two people. One car. Absolutely no itinerary.<br>What could possibly go wrong?</p><p class="small">Five stops. Your choices. One very questionable adventure. Sound starts when you start the engine; you can mute it anytime.</p><button class="cta" id="next">START THE ENGINE →</button><div class="hint">Best experienced with the volume turned up a little. 🖤❤️</div>';document.getElementById('next').onclick=()=>{startAudio();tone(65,.9,'sawtooth',.08);step=0;render()};return}if(step>=questions.length){renderEnding();return}let q=questions[step],selected=answers[step];panel.innerHTML='<div class="eyebrow">'+q.scene+'</div><h2>'+q.title+'</h2><p>'+q.lead+'</p><div class="options">'+q.opts.map((o,i)=>'<button type="button" class="option '+(selected.includes(i)?'selected':'')+'" data-index="'+i+'" aria-pressed="'+selected.includes(i)+'"><span class="emoji">'+o[0]+'</span><span>'+o[1]+'</span></button>').join('')+'</div><button class="cta" id="next" '+(!selected.length?'disabled':'')+'>'+(step===4?'REVEAL OUR DESTINATION →':'KEEP DRIVING →')+'</button><div class="hint">'+(q.multi?'Choose as many as you like.':'Choose one to continue.')+'</div><div class="progress">'+questions.map((_,i)=>'<span class="'+(i<=step?'active':'')+'"></span>').join('')+'</div>';panel.querySelectorAll('.option').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.index);if(q.multi){answers[step]=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i]}else answers[step]=[i];tone(440,.08,'sine',.07);render()});document.getElementById('next').onclick=()=>{transitionSound();step++;render();sceneSound()}}
function report(){return '🖤 NELL BEFORE NOON — DAY 12 ❤️\n🚘 THE ROAD TRIP ROULETTE\n\n'+questions.map((q,i)=>q.title+'\n'+answers[i].map(n=>'• '+q.opts[n][0]+' '+q.opts[n][1]).join('\n')).join('\n\n')+'\n\nTurns out, the destination was never really the point. 🖤❤️'}function personality(){const a=answers.flatMap((arr,i)=>arr.map(j=>questions[i].opts[j][1]));if(a.some(x=>/Haunted|haunted|Creepy|motel/.test(x)))return 'THE BEAUTIFULLY HAUNTED CO-PILOT';if(a.some(x=>/cat|Cat/.test(x)))return 'THE SOFT-HEARTED DETOUR QUEEN';if(a.some(x=>/No destination|chaotic|ridiculous/.test(x)))return 'THE CHAOS-LOVING NAVIGATOR';return 'THE MIDNIGHT MILES ROMANTIC'}function renderEnding(){let msg=report();panel.innerHTML='<div class="eyebrow">FINAL STOP · DESTINATION UNKNOWN</div><h2>'+personality()+'</h2><p>Somehow we survived the playlist, the detours, and whatever was making that noise outside the motel.</p><p>Turns out, the destination was never really the point. 🖤❤️</p><div class="report" id="report"></div><button class="cta" id="send">TEXT RYAN OUR ROAD TRIP →</button><button class="option" style="width:100%;justify-content:center;margin-top:12px" id="copy">📋 Copy our answers instead</button><div class="hint">On Android, tap Text Ryan to open your messaging app with your answers. If your phone doesn't fill in the message, use Copy and paste it into your text.</div>';document.getElementById('report').textContent=msg;document.getElementById('send').onclick=()=>{const body=encodeURIComponent(msg);window.location.href='sms:+16082340286?body='+body};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);document.getElementById('copy').textContent='✓ Copied!'}catch(e){let t=document.createElement('textarea');t.value=msg;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();document.getElementById('copy').textContent='✓ Copied!'}}}render();
</script></body></html>
