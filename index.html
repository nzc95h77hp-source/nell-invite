<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0910"><title>Nell After Dark — The Unsolved Files</title><style>
:root{color-scheme:dark;--bg:#0b0910;--panel:#17121e;--edge:#49354f;--ink:#f4e9e8;--muted:#bbaabf;--red:#bd5165;--purple:#9c79bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#312036 0%,#0b0910 58%);color:var(--ink);font:16px/1.65 Georgia,serif;min-height:100svh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff1 4px);z-index:3}.wrap{max-width:740px;margin:auto;padding:25px 18px 90px}.top{text-align:center;letter-spacing:.22em;text-transform:uppercase;font:11px/1.8 system-ui;color:#d2b1c7}.sigil{text-align:center;font-size:43px;color:#d1a0b9;margin:12px}.card{background:linear-gradient(145deg,#201727,#120e18);border:1px solid var(--edge);border-radius:18px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 60px #0008;position:relative;overflow:hidden}.card:after{content:"CLASSIFIED • 11.02.26";position:absolute;top:14px;right:-42px;transform:rotate(35deg);background:#662e43;color:#f8d8e1;font:9px system-ui;letter-spacing:2px;padding:5px 43px;opacity:.8}h1,h2{font-weight:normal;line-height:1.16;margin:12px 0 20px}h1{font-size:clamp(35px,8vw,57px)}h2{font-size:clamp(26px,6vw,39px)}.eyebrow{font:12px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#ce9fb7}.muted{color:var(--muted)}.quote{border-left:2px solid var(--red);padding:10px 18px;margin:22px 0;color:#f1cbd6;font-style:italic}.btn{display:block;width:100%;padding:15px 18px;border:1px solid #9a698a;background:linear-gradient(125deg,#5e314f,#392840);color:#fff;border-radius:11px;font:600 14px system-ui;letter-spacing:.04em;cursor:pointer;margin:12px 0;text-align:left;min-height:50px}.btn:active{transform:scale(.99)}.btn:focus-visible{outline:3px solid #f4a8cf}.btn.secondary{background:#241c2d;border-color:#55435f}.btn.selected{background:#5c3d63;border-color:#e8b2cc;box-shadow:inset 0 0 0 1px #e8b2cc}.btn.center{text-align:center}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.tiny{font:11px/1.5 system-ui;letter-spacing:.12em;color:#c4a5b9;text-transform:uppercase}.evidence{padding:18px;margin:14px 0;border:1px dashed #76576f;border-radius:9px;background:#1c1621}.evidence strong{display:block;color:#f3c7d3;letter-spacing:.05em}.hide{display:none!important}.divider{height:1px;background:linear-gradient(90deg,transparent,#75506e,transparent);margin:25px 0}.progress{height:4px;background:#34283c;border-radius:4px;overflow:hidden;margin:15px 0 25px}.bar{height:100%;background:linear-gradient(90deg,#a65b83,#c7a2d5);transition:width .35s}.footer{text-align:center;font:11px system-ui;color:#9c829d;margin-top:28px}.seal{display:inline-block;border:1px solid #a66e83;padding:8px 13px;transform:rotate(-4deg);font:700 12px system-ui;letter-spacing:.17em;color:#e4a4bb}.flash{animation:appear .5s ease both}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.toggle{background:none;color:#d7bdd4;border:1px solid #55435f;border-radius:20px;padding:7px 12px;font:12px system-ui;cursor:pointer}.reveal{background:#2b1c2b;border-left:3px solid #c5819d;padding:14px;margin:12px 0}.heart{color:#d56a80}button{touch-action:manipulation} @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div class="top">Nell After Dark · November II</div><div class="sigil">☾ ✦ ☽</div><div class="row" style="margin-bottom:14px"><span class="tiny">Department of Unexplained Occurrences</span><button class="toggle" id="sound" aria-pressed="false">♫ Sound off</button></div><div id="app" class="card" aria-live="polite"></div><div class="footer">HALLOWEEN MAY BE OVER. FORTUNATELY, THE STRANGE THINGS HAVE STAYED.<br>🖤 + ❤️</div></main><script>
(()=>{'use strict';const app=document.getElementById('app'),soundBtn=document.getElementById('sound');let step=0,opened=new Set(),answers={},audio=null,sound=false;const scenes=['introduction','brief','evidence','witnesses','deduction','verdict','ending'];function beep(freq=180,dur=.11){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.55),audio.currentTime+dur);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.055,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.02)}catch(e){}}soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'♫ Sound on':'♫ Sound off';soundBtn.setAttribute('aria-pressed',String(sound));beep(260,.25)};function next(){beep(230,.16);step++;render();window.scrollTo({top:0,behavior:'smooth'})}function shell(label,title,content){app.innerHTML=`<div class="eyebrow">${label}</div><h1>${title}</h1><div class="progress"><div class="bar" style="width:${(step+1)/scenes.length*100}%"></div></div>${content}`;app.classList.remove('flash');void app.offsetWidth;app.classList.add('flash')}function btn(text,fn,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.onclick=fn;return b}function addNext(text='Continue →'){app.append(btn(text,next,'center'))}function choice(label,opts,multi=false){let box=document.createElement('div');box.innerHTML=`<p class="eyebrow">${label}</p><p class="tiny">${multi?'Select all that apply':'Choose one'}</p>`;let selected=new Set(answers[label]||[]),buttons=[];opts.forEach((o,i)=>{let b=btn(o,()=>{beep(320,.09);if(multi){selected.has(i)?selected.delete(i):selected.add(i)}else{selected=new Set([i])}answers[label]=[...selected];buttons.forEach((x,j)=>x.classList.toggle('selected',selected.has(j)));go.disabled=!selected.size},'secondary');b.classList.toggle('selected',selected.has(i));buttons.push(b);box.append(b)});let go=btn('Seal this answer →',()=>{step++;render();window.scrollTo({top:0,behavior:'smooth'})},'center');go.disabled=!selected.size;box.append(go);app.append(box)}function render(){switch(step){case 0:shell('Case no. 001 · Intake','The Thirteenth Knock',`<p>Investigator Nell,</p><p>At 11:13 p.m., a woman called emergency services from a house that had been empty for thirteen years.</p><p>She claimed someone was knocking from <em>inside</em> a locked room.</p><p>When police arrived, the room was empty. The knocking continued.</p><div class="quote">“Please don't let it hear you counting.”</div><p class="muted">Tonight, there are no trick questions about your feelings. Just a strange little mystery and the pleasure of being deeply suspicious of everyone.</p><span class="seal">FILE UNSEALED</span>`);addNext('Accept the case →');break;case 1:shell('Incident report','The House on Briar Lane',`<p><strong>Location:</strong> 13 Briar Lane<br><strong>Reported:</strong> 11:13 p.m.<br><strong>Caller:</strong> Mara Vale, caretaker<br><strong>Room:</strong> Upstairs nursery, locked from outside</p><div class="evidence"><strong>Official incident summary</strong>The first responding officer heard twelve knocks, then silence. Mara insisted there had always been thirteen. The officer's body camera recorded a faint mechanical click immediately after the twelfth knock.</div><p>Three pieces of evidence have been recovered. Inspect each before you proceed.</p>`);addNext('Open the evidence locker →');break;case 2:shell('Evidence locker','Three Things That Shouldn’t Agree',`<p class="muted">Tap each sealed item to inspect it. All three must be opened.</p><div id="items"></div><p id="count" class="tiny"></p>`);const data=[['A · The nursery door','The lock is on the hallway side. Fresh scratches surround the keyhole, but there are no marks on the interior handle.'],['B · The recording','The knocks arrive at exactly five-second intervals. After knock twelve, a soft click is audible—then a long, low hum.'],['C · The floor plan','A maintenance shaft runs behind the nursery wall. The shaft connects to the basement, where an old automatic heating system remains wired to a timer.']];let items=document.getElementById('items'),count=document.getElementById('count'),advance=btn('Review the witnesses →',next,'center');data.forEach(([title,desc],i)=>{let b=btn((opened.has(i)?'▾ ':'▸ ')+title,()=>{opened.add(i);beep(140,.17);render()},'secondary');items.append(b);if(opened.has(i)){let d=document.createElement('div');d.className='reveal';d.textContent=desc;items.append(d)}});count.textContent=`${opened.size} of 3 evidence items examined`;advance.disabled=opened.size<3;app.append(advance);break;case 3:shell('Witness statements','Everybody Heard Something Different',`<div class="evidence"><strong>Mara Vale · Caretaker</strong>“It started as soon as I turned the heat on. Twelve knocks, a pause, then one more. I never opened the door.”</div><div class="evidence"><strong>Officer Bell · First responder</strong>“I counted twelve. I heard a click after. The caretaker kept telling me I was wrong.”</div><div class="evidence"><strong>Jonas Reed · Former technician</strong>“That house had a pressure valve that knocked when the boiler warmed up. It wasn't safe. We were supposed to disconnect it years ago.”</div>`);addNext('Examine the contradictions →');break;case 4:shell('Your working theory','What Doesn’t Add Up?',`<p>Which clues deserve closer attention? There may be more than one.</p>`);choice('Evidence to prioritize',['The perfectly regular five-second timing','The heating system and maintenance shaft','The locked door, despite no signs of anyone inside','Mara’s insistence on a thirteenth knock'],true);break;case 5:shell('Final assessment','Name the Thing in the Wall',`<p>You've seen the evidence. What's the most plausible explanation?</p>`);choice('Your verdict',['A person hiding in the nursery','An old heating mechanism making the knocks','Something supernatural deliberately mimicking the machinery','Mara staged everything for attention']);break;case 6:let verdict=(answers['Your verdict']||[])[0];let interpretation=verdict===1?'Your instincts went straight to the machinery. Excellent detective work.':verdict===2?'A supernatural explanation is tempting. The evidence, though, points somewhere more ordinary—and perhaps more unsettling.':'An understandable suspicion. But the timing, wiring, and mechanical click point toward a different explanation.';shell('Case closed?','The Thirteenth Knock',`<p>${interpretation}</p><div class="reveal"><strong>The likely solution:</strong> The twelve knocks came from the aging heating system as pressure built. The click was the timer or relay cutting power. Mara heard an extra sound, but the officer did not. Her thirteenth knock is unverified, not proof of a ghost.</div><p>The room was locked because nobody needed to be inside it. The house itself was making the noise.</p><div class="divider"></div><p>But when the evidence was logged, the technician found a handwritten note inside the timer housing.</p><div class="quote">“If it stops at twelve, do not reset it.”</div><p>There is no record of who wrote it.</p><p class="eyebrow">One unresolved detail has been added to your file.</p><p class="muted">Investigator Nell: Your next case may explain why that note matters.</p><div class="divider"></div><p>And from the highly questionable director of this department: I like that the strange things stayed after Halloween. Especially the wonderful, slightly spooky person who makes ordinary days feel a little more interesting. 🖤❤️</p>`);app.append(btn('Reopen case no. 001 ↺',()=>{step=0;opened.clear();answers={};render();window.scrollTo({top:0,behavior:'smooth'})},'center'));break}}render()})();
</script></body></html>
