<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10070b"><title>Nell After Dark — The Final Showing</title><style>
:root{color-scheme:dark;--red:#e44d63;--cream:#f4e6d5;--muted:#b7a2a7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 12%,#3a121d 0%,#10070b 60%,#060305 100%);color:var(--cream);font-family:Georgia,serif;min-height:100dvh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.11;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px,transparent 5px);z-index:5}.wrap{width:min(650px,calc(100% - 28px));margin:0 auto;padding:35px 0 60px}.top{text-align:center;letter-spacing:.22em;font:11px system-ui,sans-serif;color:#db8794;text-transform:uppercase}.screen{border:1px solid #7d3b48;border-radius:8px;background:linear-gradient(145deg,#26121a,#11090e);padding:clamp(22px,6vw,42px);margin-top:22px;box-shadow:0 15px 60px #000a,0 0 45px #a6223422;position:relative;overflow:hidden}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 20%,#fff1 50%,transparent 80%);animation:beam 8s infinite}@keyframes beam{0%,65%{transform:translateX(-160%)}100%{transform:translateX(160%)}}h1{font-size:clamp(36px,9vw,66px);line-height:.98;text-align:center;margin:22px 0;color:#fff0df;text-shadow:2px 3px #7d1a2c;letter-spacing:.035em}h2{font-size:clamp(27px,6vw,39px);line-height:1.1;margin:12px 0 18px}.eyebrow{font:11px system-ui,sans-serif;letter-spacing:.24em;color:#f18794;text-transform:uppercase}.copy{font-size:18px;line-height:1.7;white-space:pre-line}.choices{display:grid;gap:12px;margin:25px 0}.choice,.btn{font:600 14px/1.4 system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;border-radius:5px;min-height:54px;padding:16px;text-align:left;background:#321820;color:#ffe8e3;border:1px solid #82404e;transition:background .2s,transform .2s}.choice:hover,.choice:focus-visible{background:#622334;transform:translateY(-2px)}.btn{background:#a52d45;border:1px solid #e7647a;text-align:center;text-transform:uppercase;letter-spacing:.13em;width:100%}.btn:hover{background:#c53a53}.secondary{background:transparent;border-color:#6b4951}.tiny{font:12px/1.6 system-ui,sans-serif;color:var(--muted)}.center{text-align:center}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0}.smallbtn{font:12px system-ui,sans-serif;background:#241219;color:#efd6d9;border:1px solid #64404b;border-radius:5px;padding:10px 13px;cursor:pointer}.smallbtn:disabled{opacity:.4}.progress{height:3px;background:#45242d;margin-top:20px}.progress>div{height:100%;background:#f06b7d;transition:width .4s}.symbol{text-align:center;font-size:65px;margin:12px 0;filter:drop-shadow(0 0 15px #bd274d)}.flash{animation:flash .3s 2}@keyframes flash{50%{filter:brightness(2.8)}}.ending{border-top:1px solid #7d3b48;padding-top:18px;margin-top:22px}.credits{font:11px system-ui,sans-serif;letter-spacing:.15em;text-align:center;color:#aa7c85;margin-top:30px}a{color:#ffb4c1} .hidden{display:none} @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div class="top">Nell After Dark • October 18, 2026 • An interactive nightmare</div><div class="controls"><button id="sound" class="smallbtn" type="button">♫ SOUND OFF</button><span id="chapter" class="tiny">FEATURE PRESENTATION</span><button id="back" class="smallbtn" type="button" disabled>↶ BACK</button></div><section class="screen" id="screen" aria-live="polite"></section><div class="progress"><div id="bar" style="width:0"></div></div><p class="credits">ONE TICKET. TWO SURVIVORS. NO REFUNDS.</p></main><script>
(()=>{'use strict';
const PHONE='6082340286'; // SMS recipient: Ryan
const $=id=>document.getElementById(id),screen=$('screen');let audio=null,sound=false,step='intro',history=[],state={entry:null,weapon:null,trust:null,final:null,choices:[],clues:0,damage:0,affection:0};
function audioStart(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume();}catch(e){}}
function tone(freq=75,duration=.25,type='sawtooth',vol=.09){if(!sound||!audio)return;try{let osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);gain.gain.setValueAtTime(vol,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration+.01)}catch(e){}}
function sfx(kind){if(!sound)return;audioStart();if(kind==='projector'){for(let i=0;i<5;i++)setTimeout(()=>tone(110+i*18,.045,'square',.025),i*80)}else if(kind==='scream'){tone(530,.55,'sawtooth',.12);setTimeout(()=>tone(190,.65,'sawtooth',.08),130)}else if(kind==='heartbeat'){tone(63,.18,'sine',.18);setTimeout(()=>tone(58,.24,'sine',.13),230)}else if(kind==='sting'){tone(48,1.2,'sawtooth',.12);tone(740,.3,'triangle',.055)}else tone(120,.25,'triangle',.07)}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show({act,title,body,choices=[],symbol='◈',ending=false}){$('chapter').textContent=act;$('back').disabled=history.length===0;let n=history.length;$('bar').style.width=Math.min(100,n/7*100)+'%';screen.innerHTML=`<div class="eyebrow">${esc(act)}</div><div class="symbol" aria-hidden="true">${symbol}</div><h2>${esc(title)}</h2><div class="copy">${esc(body)}</div><div class="choices">${choices.map((c,i)=>`<button class="choice" data-i="${i}" type="button">${esc(c.text)}</button>`).join('')}</div>${ending?'<div class="ending"><button class="btn" id="sms" type="button">SEND RYAN MY ENDING ↗</button><p class="tiny center">Opens your messaging app with the result filled in. You choose whether to send.</p><button class="btn secondary" id="restart" type="button">REPLAY THE NIGHTMARE ↶</button></div>':''}`;screen.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>choose(choices[Number(b.dataset.i)])));if(ending){$('sms').addEventListener('click',send);$('restart').addEventListener('click',restart)}window.scrollTo({top:0,behavior:'smooth'})}
function save(){history.push({step,state:JSON.parse(JSON.stringify(state))})}function choose(c){save();state.choices.push(c.text);if(c.effects){Object.entries(c.effects).forEach(([k,v])=>{if(typeof v==='number')state[k]+=v;else state[k]=v})}step=c.next;sfx(c.sound||'heartbeat');screen.classList.remove('flash');void screen.offsetWidth;if(c.sound==='scream')screen.classList.add('flash');render()}
function option(text,next,effects={},sound='heartbeat'){return{text,next,effects,sound}}
function render(){if(step==='intro'){screen.innerHTML=`<div class="eyebrow center">TONIGHT ONLY • ADMIT ONE</div><h1>THE FINAL<br>SHOWING</h1><p class="copy center">11:47 PM. The Blackthorn Cinema has been closed for 37 years.\n\nTonight, the projector is running.\n\nAnd the last person who bought a ticket never came out.</p><p class="tiny center">An interactive horror film starring Nell. Your decisions change the story. Some choices are catastrophically stupid. We respect that.</p><button class="btn" id="start">ENTER THE THEATER ▶</button><p class="tiny center">Tap SOUND OFF above to enable synthesized horror audio. Volume controlled by your phone.</p>`;$('start').onclick=()=>{save();step='entrance';sfx('projector');render()};$('bar').style.width='0';$('chapter').textContent='FEATURE PRESENTATION';$('back').disabled=history.length===0;return}
if(step==='entrance')return show({act:'ACT I • THE INVITATION',title:'Three ways in. Zero good ideas.',symbol:'🎟',body:'The marquee buzzes: TONIGHT: NELL.\n\nA trail of wet footprints leads through the front doors. Something scratches inside the projection booth. A side exit swings gently, though there is no wind.\n\nYour phone lights up: “DON’T TRUST THE MAN IN ROW 13.”\n\nYour phone has no signal.',choices:[option('Walk through the front doors like you own the place','lobby',{entry:'front',affection:1}),option('Climb into the projection booth','booth',{entry:'booth',clues:1}),option('Slip through the side exit','side',{entry:'side',damage:1},'sting')]});
if(step==='lobby')return show({act:'ACT I • THE LOBBY',title:'Popcorn, blood, and terrible service.',symbol:'🍿',body:'A cashier with no face offers you a bucket of popcorn. Every kernel is a tiny human tooth.\n\n“Complimentary,” she says, through the hole where her mouth should be.\n\nBehind her hangs a missing-person poster. It is your photo. The date reads TOMORROW.',choices:[option('Take the bucket. Free is free.','artifact',{clues:1},'projector'),option('Throw it at her and RUN','artifact',{damage:1},'scream')]});
if(step==='booth')return show({act:'ACT I • PROJECTION BOOTH',title:'The film is still warm.',symbol:'📽',body:'A projector runs without a reel. On the screen: live footage of you standing exactly where you are.\n\nThe version of you in the film smiles. You are not smiling.\n\nA handwritten note says: “THE FILM CAN LIE. THE SCARS CANNOT.”',choices:[option('Pocket the note and inspect the film','artifact',{clues:1},'projector'),option('Smash the projector with a chair','artifact',{damage:1},'sting')]});
if(step==='side')return show({act:'ACT I • THE SIDE DOOR',title:'The hallway is breathing.',symbol:'🚪',body:'The walls pulse like something alive. A janitor drags a mop through a red puddle, humming a lullaby backward.\n\n“Don’t go into Row 13,” he whispers. “That’s where the boyfriend gets edited out.”',choices:[option('Ask what happened to the boyfriend','artifact',{clues:1}),option('Steal the janitor’s enormous mop','artifact',{weapon:'mop'},'projector')]});
if(step==='artifact')return show({act:'ACT II • THE SCREENING',title:'The audience is already dead.',symbol:'👁',body:'The auditorium is packed with mannequins. They all turn their heads as you enter.\n\nOnscreen, a man sits alone in Row 13. You recognize him. Ryan.\n\nThen his onscreen head turns 180 degrees.\n\nA voice from the speakers purrs: “CHOOSE YOUR PROP, FINAL GIRL.”',choices:[option('Grab the blood-slick fire axe','voice',{weapon:'axe',damage:1},'sting'),option('Take the silver film reel marked CUT SCENE','voice',{weapon:'reel',clues:1},'projector'),option('Keep the cursed popcorn / whatever is in reach','voice',{weapon:'popcorn',affection:1},'scream')]});
if(step==='voice')return show({act:'ACT II • THE VOICE',title:'Ryan calls from the darkness.',symbol:'☎',body:'Your phone rings. Caller ID: RYAN.\n\nHis voice says, “Nell, listen carefully. There are two of me. One is in the film. One is behind you. Only one is real.”\n\nA second voice behind you says, “That is exactly what the fake Ryan would say.”\n\nBoth voices say your name at the same time.',choices:[option('Trust the Ryan on the phone','reveal',{trust:'phone',clues:1}),option('Trust the Ryan behind you','reveal',{trust:'behind',affection:1},'scream'),option('Trust neither. Demand they prove it.','reveal',{trust:'neither',clues:2},'sting')]});
if(step==='reveal'){let t=state.trust==='phone'?'The voice on the phone whispers: “Ask what makes you laugh when you are scared.” The line goes dead.':state.trust==='behind'?'You turn. Ryan is there, covered in fake-looking blood. “For the record,” he says, “this is an awful date venue.”':'You demand proof. Both Ryans answer with the same terrible joke. Then the one in the film glitches and screams in reverse.';return show({act:'ACT III • THE STRANGER',title:'The director wants a rewrite.',symbol:'🎬',body:t+'\n\nThe projectionist crawls out of the screen on six jointed limbs, wearing a tuxedo sewn from movie tickets.\n\n“WE ONLY NEED ONE MORE SCENE,” it hisses. “A BEAUTIFUL, DISASTROUS ENDING.”\n\nIt offers you a choice.',choices:[option('Fight the monster with your chosen prop','fight',{final:'fight'},'scream'),option('Burn the film and risk losing Ryan','burn',{final:'burn'},'sting'),option('Take Ryan’s hand and run for the exit','escape',{final:'escape',affection:2},'heartbeat')]})}
if(step==='fight'){let w=state.weapon==='axe'?'You swing the axe. The creature splits open, spilling thousands of movie tickets.':state.weapon==='reel'?'You hurl the silver reel. The monster gets tangled in its own footage, screaming in 35mm.':'You launch a fistful of cursed popcorn. Against all reason, the creature is violently allergic to it.';return show({act:'ACT IV • THE FINAL CUT',title:'Violence is apparently a valid genre.',symbol:'🪓',body:w+'\n\nThe screen begins to collapse. Ryan reaches for you. The exit sign changes to: CHOOSE WHAT SURVIVES.',choices:[option('Save Ryan, even if the movie takes you','end',{final:'sacrifice',affection:2},'sting'),option('Drag Ryan out. Nobody dies on date night.','end',{final:'together',affection:2,clues:1},'heartbeat'),option('Take the director’s chair. Become the monster.','end',{final:'director'},'scream')]})}
if(step==='burn')return show({act:'ACT IV • THE FINAL CUT',title:'Everything looks better on fire.',symbol:'🔥',body:'You feed the cursed film into the projector lamp. It ignites with a scream that sounds suspiciously like a thousand bad first dates.\n\nRyan begins flickering like an old VHS tape. The theater doors burst open.\n\nA new reel appears: “THE LAST CHANCE.”',choices:[option('Pull Ryan into the light before he fades','end',{final:'together',affection:2},'heartbeat'),option('Step into the burning screen to retrieve him','end',{final:'sacrifice',clues:1},'sting'),option('Keep the reel. Make a sequel.','end',{final:'sequel'},'scream')]});
if(step==='escape')return show({act:'ACT IV • THE FINAL CUT',title:'The exit is not an exit.',symbol:'💀',body:'You grab Ryan’s hand and sprint through the lobby. The doors open onto the auditorium. Again.\n\nThe mannequins stand and applaud. The projectionist announces: “THE LOVERS HAVE REQUESTED AN ENCORE.”\n\nRyan squeezes your hand. “We can be a little more stubborn than a haunted theater.”',choices:[option('Kiss him to break the curse. Horror rules.','end',{final:'kiss',affection:3},'heartbeat'),option('Kick down the screen together','end',{final:'together',clues:1},'sting'),option('Turn around and scare the monsters back','end',{final:'director'},'scream')]});
if(step==='end'){let endings={sacrifice:['THE GHOST IN ROW 13','You save Ryan. The theater claims its price.\n\nThe next night, a new poster appears: NELL — COMING SOON.\n\nBut every time Ryan visits, the projector starts by itself, and the screen displays one message: “YOU STILL OWE ME A SECOND DATE.”','🕯'],together:['TWO TICKETS OUT','You and Ryan burst through the screen into the cold night air. The cinema implodes behind you in a spectacular shower of sparks and extremely questionable popcorn.\n\nRyan looks at you: “So... same time next week?”\n\nYou both laugh. Behind you, the marquee changes to: SEQUEL CONFIRMED.','🖤'],director:['THE NEW DIRECTOR','You steal the director’s chair. The monsters kneel. The mannequins scream.\n\nRyan is now your extremely handsome assistant director.\n\nCongratulations: you are the final boss. The theater is yours, and the critics are terrified.','👑'],sequel:['COMING SOON: PART II','You escape with the forbidden reel. Ryan makes it out, but his reflection keeps arriving two seconds late.\n\nAt midnight, your phone plays a trailer for a movie that does not exist yet.\n\nIt stars both of you. Opening night is tomorrow.','🎞'],kiss:['THE KISS THAT KILLED THE CURSE','You kiss Ryan in the middle of the nightmare. The screen cracks. Every monster bursts into furious confetti.\n\nThe projectionist screams: “THAT WAS NOT IN THE SCRIPT!”\n\nRyan smiles: “Best plot twist ever.”\n\nThe theater finally lets you leave. Together.','💋']};let e=endings[state.final]||endings.together;state.endingTitle=e[0];return show({act:'THE END • YOUR ENDING',title:e[0],symbol:e[2],body:e[1]+'\n\nYOUR NIGHTMARE FILE\nEntry: '+(state.entry||'unknown')+'\nWeapon: '+(state.weapon||'none')+'\nTrusted: '+(state.trust||'nobody')+'\nChaos level: '+(state.damage>1?'ABSOLUTELY UNHINGED':state.damage?'QUESTIONABLE':'SUSPICIOUSLY CALM')+'\nClues found: '+state.clues,ending:true})}}
function send(){const message='🎬 NELL AFTER DARK — THE FINAL SHOWING\n\nMy ending: '+(state.endingTitle||'The End')+'\n\nI entered through: '+state.entry+'\nMy weapon: '+state.weapon+'\nI trusted: '+state.trust+'\nClues: '+state.clues+'\n\nMy choices:\n'+state.choices.map((x,i)=>(i+1)+'. '+x).join('\n')+'\n\nSo, Ryan... when is our sequel? 🖤';const sms='sms:'+PHONE+'?body='+encodeURIComponent(message);const a=document.createElement('a');a.href=sms;document.body.appendChild(a);a.click();a.remove();let fallback=$('fallback');if(!fallback){fallback=document.createElement('button');fallback.className='btn secondary';fallback.id='fallback';fallback.textContent='COPY MY RESULTS INSTEAD';$('sms').insertAdjacentElement('afterend',fallback);fallback.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(message);fallback.textContent='COPIED! PASTE INTO A TEXT TO RYAN'}catch(e){const ta=document.createElement('textarea');ta.value=message;ta.style.width='100%';ta.rows=8;fallback.insertAdjacentElement('afterend',ta);ta.select();fallback.textContent='SELECT AND COPY THE TEXT BELOW'}})}}
function restart(){history=[];state={entry:null,weapon:null,trust:null,final:null,choices:[],clues:0,damage:0,affection:0};step='intro';render()}
$('back').onclick=()=>{if(!history.length)return;const old=history.pop();step=old.step;state=old.state;render()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫ SOUND ON':'♫ SOUND OFF';if(sound){audioStart();sfx('projector')}};render();
})();
</script></body></html>
