<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nell's Next Decision</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:0}
.stage{position:relative;width:100%;line-height:0;user-select:none;-webkit-user-select:none}
.stage>img{display:block;width:100%;height:auto}
.zone{position:absolute;left:.85%;width:98.3%;cursor:pointer;line-height:normal;background:transparent}
.zone input{position:absolute;opacity:0;pointer-events:none}
/* Coordinates matched to the actual neon borders in the artwork */
.z1{top:15.75%;height:20.75%;border-radius:3.2% / 10%}
.z2{top:36.55%;height:20.05%;border-radius:2.8% / 10%}
.z3{top:56.75%;height:24.85%;border-radius:2.8% / 8%}
.check{display:none;position:absolute;right:2.2%;top:5%;z-index:7;background:#08090de8;border:2px solid #fff;color:#fff;border-radius:99px;padding:9px 13px;font:900 11px Arial,sans-serif;line-height:1}
.zone:has(input:checked) .check{display:block}
/* This sits directly on top of the red button drawn in the PNG */
</style>

<style id="css-only-lock">
#lockWrap{display:none;max-width:820px;margin:16px auto 30px;padding:0 12px;text-align:center}
body:has(input[name="zone"]:checked) #lockWrap{display:block}
#lockToggle{position:absolute;opacity:0;pointer-events:none}
#lockBtn{display:block;width:100%;padding:19px 14px;border:2px solid #ff4051;border-radius:15px;background:linear-gradient(#b51b29,#6f0c15);color:#fff;box-shadow:0 0 20px rgba(216,32,55,.38);font:900 18px Georgia,serif;letter-spacing:.04em;cursor:pointer}
#lockedPanel{display:none;margin-top:14px;padding:18px 12px;border:1px solid #5c252d;border-radius:15px;background:#111;color:#e8c27c;font:900 16px Georgia,serif}
#lockToggle:checked ~ #lockBtn{display:none}
#lockToggle:checked ~ #lockedPanel{display:block}
#sendRyan{display:block;margin-top:14px;padding:16px 12px;border:2px solid #ff4051;border-radius:13px;background:#780e18;color:#fff;text-decoration:none;font:900 14px Arial,sans-serif}
</style>


<style id="sms-only-fix">
.smsLinks .sendRyan{display:none;margin-top:14px;padding:16px 12px;border:2px solid #ff4051;border-radius:13px;background:#780e18;color:#fff;text-decoration:none;font:900 14px Arial,sans-serif}
body:has(input[name="zone"][value="The Beast of Bailey Downs"]:checked) .smsLinks .beast{display:block}
body:has(input[name="zone"][value="United Against Life As We Know It"]:checked) .smsLinks .united{display:block}
body:has(input[name="zone"][value="Brigitte's Safe Zone"]:checked) .smsLinks .brigitte{display:block}
</style>
